<!--
  Emotional CRM – Oberfläche (Phase 2)
  Komplett in ein EMBED-WIDGET einer Flenski-Custom-Page einfügen (Titel des Widgets aus, Sichtbarkeit "nur Team").
  Nicht ins Fußzeilen-Feld – dort läuft kein Skript (Entscheidung 0001).
  Pro Mandantin nur die Zeile CRM_CONFIG anpassen. Supabase-Adresse und "anon key" sind öffentlich und dürfen hier stehen.
  Alle Regeln (Guthaben, Abbuchung, Signale) rechnet die Datenbank, hier wird nur angezeigt und aufgerufen.
-->
<script>window.CRM_CONFIG = { tenant: "yoga-by-lana" };</script>

<div id="ecrm-root">
  <div class="ecrm-boot" id="ecrm-boot">CRM wird geladen …</div>

  <div class="ecrm-app" x-data="ecrm" x-cloak>
    <!-- ===== Anmeldung ===== -->
    <template x-if="view === 'login'">
      <div class="ecrm-card ecrm-login">
        <h2 class="ecrm-h2">Anmelden</h2>
        <template x-if="!login.codeSent">
          <div>
            <p class="ecrm-muted">Gib deine E-Mail-Adresse ein. Du bekommst einen 6-stelligen Code.</p>
            <input class="ecrm-input" type="email" inputmode="email" autocomplete="email" placeholder="deine E-Mail-Adresse"
                   x-model.trim="login.email" @keydown.enter="sendCode()">
            <button class="ecrm-btn ecrm-btn-primary ecrm-btn-block" @click="sendCode()" :disabled="busy">Code senden</button>
          </div>
        </template>
        <template x-if="login.codeSent">
          <div>
            <p class="ecrm-muted">Code ist unterwegs an <b x-text="login.email"></b>. Schau auch im Spam-Ordner.</p>
            <input class="ecrm-input ecrm-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6"
                   placeholder="6-stelliger Code" x-model.trim="login.code" @keydown.enter="verifyCode()">
            <button class="ecrm-btn ecrm-btn-primary ecrm-btn-block" @click="verifyCode()" :disabled="busy">Anmelden</button>
            <button class="ecrm-link" @click="login.codeSent = false; login.code = ''">Andere E-Mail-Adresse</button>
          </div>
        </template>
      </div>
    </template>

    <!-- ===== Kein Zugang ===== -->
    <template x-if="view === 'nozugang'">
      <div class="ecrm-card">
        <h2 class="ecrm-h2">Kein Zugang</h2>
        <p>Du bist angemeldet als <b x-text="userEmail"></b>, aber für diese App noch nicht freigeschaltet.</p>
        <p class="ecrm-muted">Bitte melde dich bei Systemsafari, dann wirst du eingeladen.</p>
        <button class="ecrm-btn" @click="logout()">Abmelden</button>
      </div>
    </template>

    <!-- ===== Hauptbereich ===== -->
    <template x-if="view === 'app'">
      <div>
        <nav class="ecrm-tabs">
          <button :class="tab === 'checkin' && 'ecrm-active'" @click="openTab('checkin')">Check-in</button>
          <button :class="tab === 'kundinnen' && 'ecrm-active'" @click="openTab('kundinnen')">Kundinnen</button>
          <button :class="tab === 'verkauf' && 'ecrm-active'" @click="openTab('verkauf')">Verkauf</button>
          <button :class="tab === 'mehr' && 'ecrm-active'" @click="openTab('mehr')">Mehr</button>
        </nav>

        <!-- ===== CHECK-IN: Stunden des Tages ===== -->
        <section x-show="tab === 'checkin' && !session">
          <div class="ecrm-daybar">
            <button class="ecrm-btn ecrm-btn-icon" @click="shiftDay(-1)" aria-label="Tag zurück">‹</button>
            <div class="ecrm-daylabel" x-text="dayLabel()"></div>
            <button class="ecrm-btn ecrm-btn-icon" @click="shiftDay(1)" aria-label="Tag vor">›</button>
          </div>

          <template x-for="s in sessions" :key="s.id">
            <button class="ecrm-card ecrm-session" @click="openSession(s)">
              <div>
                <div class="ecrm-strong" x-text="s.title"></div>
                <div class="ecrm-muted" x-text="time(s.starts_at) + (s.category ? ' · ' + s.category : '')"></div>
              </div>
              <div class="ecrm-pill" x-text="(s.present || 0) + ' da'"></div>
            </button>
          </template>

          <template x-for="v in suggestions" :key="v.source_session">
            <button class="ecrm-card ecrm-session ecrm-suggestion" @click="takeSuggestion(v)">
              <div>
                <div class="ecrm-strong" x-text="v.title"></div>
                <div class="ecrm-muted" x-text="time(v.starts_at) + ' · wie letzte Woche'"></div>
              </div>
              <div class="ecrm-pill ecrm-pill-ghost">+ anlegen</div>
            </button>
          </template>

          <template x-if="!sessions.length && !suggestions.length && !loading">
            <p class="ecrm-empty">Für diesen Tag ist noch keine Stunde angelegt.</p>
          </template>

          <template x-if="!newSession">
            <button class="ecrm-btn ecrm-btn-block" @click="startNewSession()">+ Stunde anlegen</button>
          </template>
          <template x-if="newSession">
            <div class="ecrm-card">
              <h3 class="ecrm-h3">Neue Stunde</h3>
              <label class="ecrm-label">Titel<input class="ecrm-input" x-model.trim="newSession.title" placeholder="z. B. Yoga am Dienstag"></label>
              <div class="ecrm-row2">
                <label class="ecrm-label">Beginn<input class="ecrm-input" type="time" x-model="newSession.time"></label>
                <label class="ecrm-label">Dauer (Min.)<input class="ecrm-input" type="number" inputmode="numeric" x-model.number="newSession.minutes"></label>
              </div>
              <label class="ecrm-label">Kategorie
                <select class="ecrm-input" x-model="newSession.category">
                  <option value="">alle Karten gelten</option>
                  <template x-for="c in categories()" :key="c"><option :value="c" x-text="c"></option></template>
                </select>
              </label>
              <div class="ecrm-actions">
                <button class="ecrm-btn" @click="newSession = null">Abbrechen</button>
                <button class="ecrm-btn ecrm-btn-primary" @click="saveSession()" :disabled="busy">Anlegen</button>
              </div>
            </div>
          </template>
        </section>

        <!-- ===== CHECK-IN: eine Stunde ===== -->
        <section x-show="tab === 'checkin' && session">
          <template x-if="session">
            <div>
              <button class="ecrm-link" @click="closeSession()">‹ alle Stunden</button>
              <div class="ecrm-headline">
                <div>
                  <h2 class="ecrm-h2" x-text="session.title"></h2>
                  <div class="ecrm-muted" x-text="dateLong(session.starts_at) + ', ' + time(session.starts_at)"></div>
                </div>
                <div class="ecrm-count"><b x-text="presentCount()"></b><span x-text="'von ' + roster.length + ' da'"></span></div>
              </div>

              <input class="ecrm-input" type="search" placeholder="Kundin hinzufügen: Name tippen …" x-model="rosterSearch">
              <template x-for="c in rosterMatches()" :key="c.customer_id">
                <button class="ecrm-result" @click="addToRoster(c)">
                  <span x-text="fullName(c)"></span><span class="ecrm-muted" x-text="balanceText(c)"></span>
                </button>
              </template>

              <template x-if="!roster.length && !loading">
                <p class="ecrm-empty">Noch niemand auf der Liste. Tippe oben einen Namen.</p>
              </template>

              <div class="ecrm-list">
                <template x-for="r in roster" :key="r.customer_id">
                  <div class="ecrm-person" :class="{ 'ecrm-present': r.status === 'present', 'ecrm-warn': rowWarn(r), 'ecrm-off': ['cancelled_in_time','cancelled_late','no_show'].includes(r.status) }">
                    <button class="ecrm-person-main" @click="toggleCheckin(r)" :disabled="r._busy">
                      <span class="ecrm-check" x-text="r.status === 'present' ? '✓' : ''"></span>
                      <span>
                        <span class="ecrm-strong" x-text="fullName(r)"></span>
                        <span class="ecrm-sub" x-text="rowText(r)"></span>
                      </span>
                    </button>
                    <template x-if="rowWarn(r) && !canRebook(r)">
                      <button class="ecrm-btn ecrm-btn-small ecrm-btn-warn" @click="sellFor(r)">Karte verkaufen</button>
                    </template>
                    <template x-if="canRebook(r)">
                      <button class="ecrm-btn ecrm-btn-small ecrm-btn-primary" @click="rebook(r)" :disabled="r._busy">Jetzt abbuchen</button>
                    </template>
                    <button class="ecrm-more" @click="r._menu = !r._menu" aria-label="Weitere Aktionen">⋯</button>
                    <div class="ecrm-menu" x-show="r._menu" @click.outside="r._menu = false">
                      <button @click="cancelRow(r, false)">Abgesagt</button>
                      <button @click="cancelRow(r, true)">Nicht erschienen</button>
                      <button @click="openCustomerById(r.customer_id)">Kundin ansehen</button>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </section>

        <!-- ===== KUNDINNEN: Liste ===== -->
        <section x-show="tab === 'kundinnen' && !customer && !customerForm">
          <div class="ecrm-searchrow">
            <input class="ecrm-input" type="search" placeholder="Name oder E-Mail suchen" x-model="search">
            <button class="ecrm-btn" :class="filterOpen && 'ecrm-btn-primary'" @click="filterOpen = !filterOpen"
                    x-text="'Filter' + (activeFilterCount() ? ' (' + activeFilterCount() + ')' : '')"></button>
          </div>
          <div class="ecrm-card ecrm-filters" x-show="filterOpen">
            <div class="ecrm-chips">
              <button :class="f.source === 'flenski' && 'ecrm-on'" @click="f.source = f.source === 'flenski' ? '' : 'flenski'">App</button>
              <button :class="f.source === 'extern' && 'ecrm-on'" @click="f.source = f.source === 'extern' ? '' : 'extern'">Extern</button>
              <button :class="f.balance === '0' && 'ecrm-on'" @click="f.balance = f.balance === '0' ? '' : '0'">Guthaben 0</button>
              <button :class="f.balance === '1' && 'ecrm-on'" @click="f.balance = f.balance === '1' ? '' : '1'">Guthaben 1</button>
              <button :class="f.balance === 'more' && 'ecrm-on'" @click="f.balance = f.balance === 'more' ? '' : 'more'">Guthaben &gt; 1</button>
              <button :class="f.expiring && 'ecrm-on'" @click="f.expiring = !f.expiring">läuft ab ≤ 14 Tage</button>
              <button :class="f.away && 'ecrm-on'" @click="f.away = f.away ? 0 : 21">lange nicht da</button>
              <button :class="f.archived && 'ecrm-on'" @click="f.archived = !f.archived">archiviert</button>
            </div>
            <div class="ecrm-row2" x-show="f.away">
              <label class="ecrm-label">nicht da seit mehr als (Tagen)<input class="ecrm-input" type="number" inputmode="numeric" x-model.number="f.away"></label>
            </div>
            <div class="ecrm-row2">
              <label class="ecrm-label">Produkt
                <select class="ecrm-input" x-model="f.product">
                  <option value="">alle</option>
                  <template x-for="p in products" :key="p.id"><option :value="p.name" x-text="p.name"></option></template>
                </select>
              </label>
              <label class="ecrm-label">Tag
                <select class="ecrm-input" x-model="f.tag">
                  <option value="">alle</option>
                  <template x-for="t in allTags()" :key="t"><option :value="t" x-text="t"></option></template>
                </select>
              </label>
            </div>
            <button class="ecrm-link" @click="resetFilters()">Filter zurücksetzen</button>
          </div>

          <button class="ecrm-btn ecrm-btn-block" @click="openCustomerForm(null)">+ Neue Kundin</button>

          <div class="ecrm-muted ecrm-small" x-text="filteredCustomers().length + ' Kundinnen'"></div>
          <template x-for="c in filteredCustomers()" :key="c.customer_id">
            <button class="ecrm-card ecrm-customer" @click="openCustomer(c)">
              <div>
                <div class="ecrm-strong">
                  <span x-text="fullName(c)"></span>
                  <span class="ecrm-badge" x-show="c.source === 'flenski'">App</span>
                  <span class="ecrm-badge" x-show="c.is_child">Kind</span>
                </div>
                <div class="ecrm-muted" x-text="lastVisitText(c)"></div>
                <div class="ecrm-signals">
                  <template x-for="s in (signals[c.customer_id] || [])" :key="s">
                    <span class="ecrm-signal" :class="'ecrm-signal-' + s" x-text="signalLabel(s)"></span>
                  </template>
                </div>
              </div>
              <div class="ecrm-pill" :class="balanceClass(c)" x-text="balanceShort(c)"></div>
            </button>
          </template>
          <template x-if="!customers.length && !loading">
            <p class="ecrm-empty">Noch keine Kundinnen – lege die erste an.</p>
          </template>
        </section>

        <!-- ===== KUNDIN: Detail ===== -->
        <section x-show="tab === 'kundinnen' && customer && !customerForm">
          <template x-if="customer">
            <div>
              <button class="ecrm-link" @click="customer = null">‹ alle Kundinnen</button>
              <div class="ecrm-card">
                <div class="ecrm-headline">
                  <div>
                    <h2 class="ecrm-h2" x-text="fullName(customer)"></h2>
                    <div class="ecrm-muted">
                      <span x-text="customer.source === 'flenski' ? 'App-Mitglied' : 'extern'"></span>
                      <span x-show="customer.archived_at"> · archiviert</span>
                    </div>
                  </div>
                  <button class="ecrm-btn ecrm-btn-small" @click="openCustomerForm(customer)">Bearbeiten</button>
                </div>
                <template x-if="customer.is_child">
                  <p class="ecrm-small">Kind – Kontakt über <b x-text="customer.guardian_name || 'Eltern'"></b>
                    <template x-if="customer.guardian_phone"><a class="ecrm-a" :href="'tel:' + customer.guardian_phone" x-text="' · ' + customer.guardian_phone"></a></template>
                    <template x-if="customer.guardian_email"><a class="ecrm-a" :href="'mailto:' + customer.guardian_email" x-text="' · ' + customer.guardian_email"></a></template>
                  </p>
                </template>
                <p class="ecrm-small">
                  <template x-if="customer.phone"><a class="ecrm-a" :href="'tel:' + customer.phone" x-text="customer.phone"></a></template>
                  <template x-if="customer.phone && customer.email"><span> · </span></template>
                  <template x-if="customer.email"><a class="ecrm-a" :href="'mailto:' + customer.email" x-text="customer.email"></a></template>
                </p>
                <div class="ecrm-signals">
                  <template x-for="s in (signals[customer.id] || [])" :key="s">
                    <span class="ecrm-signal" :class="'ecrm-signal-' + s" x-text="signalLabel(s)"></span>
                  </template>
                </div>
                <template x-if="customer.note">
                  <p class="ecrm-note" x-text="customer.note"></p>
                </template>
              </div>

              <div class="ecrm-headline"><h3 class="ecrm-h3">Karten</h3>
                <button class="ecrm-btn ecrm-btn-small ecrm-btn-primary" @click="sellFor({ customer_id: customer.id })" x-show="!customer.archived_at">+ Verkauf</button>
              </div>
              <template x-for="e in entitlements" :key="e.entitlement_id">
                <div class="ecrm-card ecrm-ent" :class="e.status !== 'active' && 'ecrm-off'">
                  <div class="ecrm-headline">
                    <div>
                      <div class="ecrm-strong" x-text="e.product_name"></div>
                      <div class="ecrm-muted" x-text="entText(e)"></div>
                    </div>
                    <div class="ecrm-pill" x-text="e.unlimited ? '∞' : e.balance"></div>
                  </div>
                  <template x-if="isOwner && e.status !== 'cancelled'">
                    <div>
                      <button class="ecrm-link" x-show="correctFor !== e.entitlement_id" @click="correctFor = e.entitlement_id; correction = { delta: 1, comment: '' }">Korrektur</button>
                      <div x-show="correctFor === e.entitlement_id" class="ecrm-correct">
                        <div class="ecrm-stepper">
                          <button class="ecrm-btn ecrm-btn-icon" @click="correction.delta--">−</button>
                          <b x-text="(correction.delta > 0 ? '+' : '') + correction.delta"></b>
                          <button class="ecrm-btn ecrm-btn-icon" @click="correction.delta++">+</button>
                        </div>
                        <input class="ecrm-input" placeholder="Grund (Pflicht), z. B. Kulanz" x-model="correction.comment">
                        <div class="ecrm-actions">
                          <button class="ecrm-btn" @click="correctFor = null">Abbrechen</button>
                          <button class="ecrm-btn ecrm-btn-primary" @click="saveCorrection(e)" :disabled="busy">Buchen</button>
                        </div>
                      </div>
                    </div>
                  </template>
                </div>
              </template>
              <template x-if="!entitlements.length">
                <p class="ecrm-empty">Noch keine Karte.</p>
              </template>

              <h3 class="ecrm-h3">Verlauf</h3>
              <div class="ecrm-card ecrm-history">
                <template x-for="h in history" :key="h.id">
                  <div class="ecrm-hrow">
                    <div class="ecrm-hdate" x-text="dateShort(h.occurred_at)"></div>
                    <div class="ecrm-htext">
                      <div x-text="historyText(h)"></div>
                      <div class="ecrm-muted ecrm-small" x-text="h.product_name + ' · ' + who(h.created_by)"></div>
                    </div>
                    <div class="ecrm-hdelta" :class="h.delta > 0 ? 'ecrm-plus' : 'ecrm-minus'" x-text="(h.delta > 0 ? '+' : '') + h.delta"></div>
                  </div>
                </template>
                <template x-if="!history.length"><p class="ecrm-empty">Noch keine Buchungen.</p></template>
              </div>

              <div class="ecrm-actions ecrm-danger-zone">
                <button class="ecrm-btn" @click="toggleArchive()" x-text="customer.archived_at ? 'Wieder aktivieren' : 'Archivieren'"></button>
                <template x-if="isOwner">
                  <button class="ecrm-btn ecrm-btn-danger" @click="anonymize()">Kundin löschen</button>
                </template>
              </div>
            </div>
          </template>
        </section>

        <!-- ===== KUNDIN: anlegen / bearbeiten ===== -->
        <section x-show="tab === 'kundinnen' && customerForm">
          <template x-if="customerForm">
            <div class="ecrm-card">
              <h3 class="ecrm-h3" x-text="customerForm.id ? 'Kundin bearbeiten' : 'Neue Kundin'"></h3>
              <div class="ecrm-row2">
                <label class="ecrm-label">Vorname *<input class="ecrm-input" x-model.trim="customerForm.first_name"></label>
                <label class="ecrm-label">Nachname<input class="ecrm-input" x-model.trim="customerForm.last_name"></label>
              </div>
              <label class="ecrm-check-label"><input type="checkbox" x-model="customerForm.is_child"> Kind (Kontakt über die Eltern)</label>
              <template x-if="customerForm.is_child">
                <div>
                  <label class="ecrm-label">Name Elternteil<input class="ecrm-input" x-model.trim="customerForm.guardian_name"></label>
                  <div class="ecrm-row2">
                    <label class="ecrm-label">Telefon Eltern<input class="ecrm-input" type="tel" x-model.trim="customerForm.guardian_phone"></label>
                    <label class="ecrm-label">E-Mail Eltern<input class="ecrm-input" type="email" x-model.trim="customerForm.guardian_email"></label>
                  </div>
                </div>
              </template>
              <template x-if="!customerForm.is_child">
                <div class="ecrm-row2">
                  <label class="ecrm-label">Telefon<input class="ecrm-input" type="tel" x-model.trim="customerForm.phone"></label>
                  <label class="ecrm-label">E-Mail<input class="ecrm-input" type="email" x-model.trim="customerForm.email"></label>
                </div>
              </template>
              <label class="ecrm-label">Tags (mit Komma trennen)<input class="ecrm-input" x-model="customerForm.tagsText" placeholder="z. B. Erwachsene, Dienstag"></label>
              <label class="ecrm-label">Notiz (nur Organisatorisches)
                <textarea class="ecrm-input" rows="3" x-model="customerForm.note"></textarea>
              </label>
              <p class="ecrm-hint">Bitte keine Gesundheitsangaben (z. B. Verletzungen, Beschwerden) eintragen.</p>
              <div class="ecrm-actions">
                <button class="ecrm-btn" @click="customerForm = null">Abbrechen</button>
                <button class="ecrm-btn ecrm-btn-primary" @click="saveCustomer()" :disabled="busy">Speichern</button>
              </div>
            </div>
          </template>
        </section>

        <!-- ===== VERKAUF ===== -->
        <section x-show="tab === 'verkauf'">
          <!-- Schritt 1: Kundin -->
          <template x-if="!sale.customer && !sale.done">
            <div>
              <h2 class="ecrm-h2">Verkauf</h2>
              <p class="ecrm-muted">Wer kauft?</p>
              <input class="ecrm-input" type="search" placeholder="Name tippen …" x-model="sale.search">
              <template x-for="c in saleMatches()" :key="c.customer_id">
                <button class="ecrm-result" @click="sale.customer = c">
                  <span x-text="fullName(c)"></span><span class="ecrm-muted" x-text="balanceText(c)"></span>
                </button>
              </template>
              <template x-if="!sale.quick">
                <button class="ecrm-btn ecrm-btn-block" @click="sale.quick = { first_name: sale.search.trim(), last_name: '' }">+ Neue Kundin</button>
              </template>
              <template x-if="sale.quick">
                <div class="ecrm-card">
                  <div class="ecrm-row2">
                    <label class="ecrm-label">Vorname *<input class="ecrm-input" x-model.trim="sale.quick.first_name"></label>
                    <label class="ecrm-label">Nachname<input class="ecrm-input" x-model.trim="sale.quick.last_name"></label>
                  </div>
                  <div class="ecrm-actions">
                    <button class="ecrm-btn" @click="sale.quick = null">Abbrechen</button>
                    <button class="ecrm-btn ecrm-btn-primary" @click="quickCustomer()" :disabled="busy">Weiter</button>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <!-- Schritt 2 + 3: Produkt und Zahlweg -->
          <template x-if="sale.customer && !sale.done">
            <div>
              <button class="ecrm-link" @click="sale.customer = null; sale.product = null">‹ andere Kundin</button>
              <h2 class="ecrm-h2" x-text="'Verkauf an ' + fullName(sale.customer)"></h2>
              <p class="ecrm-muted" x-text="sale.product ? 'Wie wurde bezahlt?' : 'Was wird gekauft?'"></p>
              <template x-if="!sale.product">
                <div class="ecrm-tiles">
                  <template x-for="p in products.filter(p => p.active)" :key="p.id">
                    <button class="ecrm-tile" @click="sale.product = p; sale.price = p.price_cents != null ? (p.price_cents / 100) : ''">
                      <span class="ecrm-strong" x-text="p.name"></span>
                      <span class="ecrm-muted" x-text="productText(p)"></span>
                    </button>
                  </template>
                  <template x-if="!products.some(p => p.active)">
                    <p class="ecrm-empty">Noch keine Produkte – lege sie unter „Mehr“ an.</p>
                  </template>
                </div>
              </template>
              <template x-if="sale.product">
                <div>
                  <div class="ecrm-card ecrm-chosen">
                    <span class="ecrm-strong" x-text="sale.product.name"></span>
                    <button class="ecrm-link" @click="sale.product = null">ändern</button>
                  </div>
                  <div class="ecrm-tiles ecrm-tiles-pay">
                    <template x-for="w in payWays" :key="w.value">
                      <button class="ecrm-tile ecrm-tile-pay" @click="doSell(w.value)" :disabled="busy" x-text="w.label"></button>
                    </template>
                  </div>

            </div>

        var admin = await this.sb.from('platform_admins').select('user_id').maybeSingle();
        var member = await this.sb.from('tenant_members').select('role').eq('tenant_id', this.tenant.id).eq('user_id', this.userId).maybeSingle();
        this.isOwner = !!(admin.data || (member.data && member.data.role === 'owner'));
        this.view = 'app';
        await Promise.all([this.loadProducts(), this.loadCustomers(), this.loadDay()]);
      },
      async logout() { await this.sb.auth.signOut(); this.view = 'login'; this.login = { email: '', code: '', codeSent: false }; },

      // ---------- Allgemein ----------
      async run(fn) {
        if (this.busy) return;
        this.busy = true;
        try { await fn(); } catch (e) { this.notify(message(e), true); } finally { this.busy = false; }
      },
      // Die Rückgängig-Funktion liegt bewusst NICHT im beobachteten Zustand: Alpine ruft Funktionen,
      // die in Ausdrücken auftauchen, selbst auf – das hat beim ersten Test eine Check-in-Schleife ausgelöst.
      notify(text, error, undo) {
        clearTimeout(this._toastTimer);
        pendingUndo = undo || null;
        this.toast = { text: text, error: !!error, hasUndo: !!undo };
        var self = this;
        this._toastTimer = setTimeout(function () { self.toast = null; pendingUndo = null; }, undo ? 6000 : 3500);
      },
      async runUndo() { var u = pendingUndo; pendingUndo = null; this.toast = null; if (u) await u(); },
      async rpc(name, args) { var r = await this.sb.rpc(name, args); if (r.error) throw r.error; return r.data; },
      openTab(t) {
        this.tab = t;
        if (t === 'kundinnen') { this.customer = null; this.customerForm = null; this.loadCustomers(); }
        if (t === 'checkin' && !this.session) this.loadDay();
        if (t === 'verkauf' && this.sale.done) this.resetSale();
        if (t === 'mehr') { this.productForm = null; this.loadTeam(); }
      },

      // ---------- Daten laden ----------
      async loadProducts() {
        var r = await this.sb.from('products').select('*').eq('tenant_id', this.tenant.id).order('active', { ascending: false }).order('name');
        this.products = r.data || [];
      },
      async loadCustomers() {
        this.loading = true;
        var r = await this.sb.from('v_customer_overview').select('*').eq('tenant_id', this.tenant.id).is('anonymized_at', null)
          .order('first_name').order('last_name');
        this.customers = r.data || [];
        try {
          var s = await this.rpc('customer_signals', { p_tenant: this.tenant.id });
          var map = {};
          (s || []).forEach(function (x) { (map[x.customer_id] = map[x.customer_id] || []).push(x.signal); });
          this.signals = map;
        } catch (e) { /* Signale sind Zusatz */ }
        this.loading = false;
      },
      async loadTeam() {
        try { this.team = await this.rpc('team_members', { p_tenant: this.tenant.id }); } catch (e) { this.team = []; }
      },

      // ---------- Check-in: Tag ----------
      dayStart() { var d = new Date(this.day); d.setHours(0, 0, 0, 0); return d; },
      isoDay() { var d = this.dayStart(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); },
      dayLabel() {
        var today = new Date(); today.setHours(0, 0, 0, 0);
        var diff = Math.round((this.dayStart() - today) / 86400000);
        var name = diff === 0 ? 'Heute' : diff === -1 ? 'Gestern' : diff === 1 ? 'Morgen' : this.dayStart().toLocaleDateString('de-DE', { weekday: 'long' });
        return name + ', ' + this.dayStart().toLocaleDateString('de-DE', { day: 'numeric', month: 'long' });
      },
      shiftDay(n) { var d = this.dayStart(); d.setDate(d.getDate() + n); this.day = d; this.newSession = null; this.loadDay(); },
      async loadDay() {
        if (!this.tenant) return;
        this.loading = true;
        var start = this.dayStart(), end = new Date(start); end.setDate(end.getDate() + 1);
        var r = await this.sb.from('sessions').select('*').eq('tenant_id', this.tenant.id)
          .gte('starts_at', start.toISOString()).lt('starts_at', end.toISOString()).order('starts_at');
        var list = r.data || [];
        if (list.length) {
          var a = await this.sb.from('attendances').select('session_id').eq('status', 'present').in('session_id', list.map(function (s) { return s.id; }));
          var counts = {};
          (a.data || []).forEach(function (x) { counts[x.session_id] = (counts[x.session_id] || 0) + 1; });
          list.forEach(function (s) { s.present = counts[s.id] || 0; });
        }
        this.sessions = list;
        try { this.suggestions = await this.rpc('session_suggestions', { p_tenant: this.tenant.id, p_day: this.isoDay() }); }
        catch (e) { this.suggestions = []; }
        this.loading = false;
      },
      async takeSuggestion(v) {
        await this.run(async () => {
          var id = await this.rpc('copy_session', { p_session: v.source_session });
          await this.loadDay();
          var s = this.sessions.find(function (x) { return x.id === id; });
          if (s) await this.openSession(s);
        });
      },
      categories() {
        var set = {};
        this.products.forEach(function (p) { if (p.category) set[p.category] = 1; });
        return Object.keys(set).sort();
      },
      startNewSession() { this.newSession = { title: '', time: '18:00', minutes: 75, category: '' }; },
      async saveSession() {
        var n = this.newSession;
        if (!n.title) return this.notify('Bitte gib der Stunde einen Titel.', true);
        await this.run(async () => {
          var parts = (n.time || '00:00').split(':');
          var start = this.dayStart(); start.setHours(+parts[0], +parts[1], 0, 0);
          var end = new Date(start.getTime() + (n.minutes || 60) * 60000);
          var r = await this.sb.from('sessions').insert({ tenant_id: this.tenant.id, title: n.title, starts_at: start.toISOString(),
            ends_at: end.toISOString(), category: n.category || null }).select().single();
          if (r.error) throw r.error;
          this.newSession = null;
          await this.loadDay();
          await this.openSession(r.data);
        });
      },

      // ---------- Check-in: eine Stunde ----------
      async openSession(s) { this.session = s; this.rosterSearch = ''; await this.loadRoster(); },
      closeSession() { this.session = null; this.roster = []; this.loadDay(); },
      async loadRoster() {
        this.loading = true;
        try {
          var rows = await this.rpc('session_roster', { p_session: this.session.id });
          this.roster = rows.map(function (r) { r._busy = false; r._menu = false; return r; });
        } catch (e) { this.notify(message(e), true); }
        this.loading = false;
      },
      presentCount() { return this.roster.filter(function (r) { return r.status === 'present'; }).length; },
      rosterMatches() {
        var q = this.rosterSearch.trim().toLowerCase();
        if (q.length < 2) return [];
        var on = {}; this.roster.forEach(function (r) { on[r.customer_id] = 1; });
        var self = this;
        return this.customers.filter(function (c) { return !c.archived_at && !on[c.customer_id] && self.fullName(c).toLowerCase().indexOf(q) > -1; }).slice(0, 6);
      },
      async addToRoster(c) {
        this.rosterSearch = '';
        var row = { customer_id: c.customer_id, first_name: c.first_name, last_name: c.last_name, status: 'registered',
          credits_balance: c.credits_balance, has_unlimited: c.has_unlimited, _busy: false, _menu: false };
        this.roster.push(row);
        // die beobachtete Fassung aus der Liste nehmen, damit die Anzeige mitzieht
        await this.toggleCheckin(this.roster[this.roster.length - 1]);
      },
      // Gesamtguthaben einer Zeile nach einer Buchung neu holen (sonst zeigt "Guthaben" den alten Stand)
      async refreshBalance(row) {
        var r = await this.sb.from('v_customer_overview').select('credits_balance,has_unlimited,next_expiry,last_visit_at')
          .eq('customer_id', row.customer_id).maybeSingle();
        if (!r.data) return;
        Object.assign(row, r.data);
        var c = this.customers.find(function (x) { return x.customer_id === row.customer_id; });
        if (c) Object.assign(c, r.data);
      },
      applyResult(row, res) {
        row.status = res.status; row.entitlement_id = res.entitlement_id; row.abgebucht = res.abgebucht;
        row.unbegrenzt = res.unbegrenzt; row.rest = res.rest; row.von = res.von; row.gueltig_bis = res.gueltig_bis;
      },
      async toggleCheckin(row) {
        if (row._busy) return;
        row._busy = true; row._menu = false;
        var wasPresent = row.status === 'present';
        var before = Object.assign({}, row);
        row.status = wasPresent ? 'registered' : 'present';   // sofort sichtbar, Datenbank bestätigt gleich
        try {
          var res = await this.rpc(wasPresent ? 'undo_checkin' : 'checkin', { p_session: this.session.id, p_customer: row.customer_id });
          this.applyResult(row, res);
          await this.refreshBalance(row);
          var self = this;
          if (!wasPresent) this.notify(this.fullName(row) + ' ist da' + (res.rest != null && !res.unbegrenzt ? ' · noch ' + res.rest : ''), false,
            function () { return row.status === 'present' ? self.toggleCheckin(row) : null; });
        } catch (e) {
          Object.assign(row, before);
          this.notify(message(e), true);
        }
        row._busy = false;
      },
      async cancelRow(row, noShow) {
        row._menu = false;
        await this.run(async () => {
          var res = await this.rpc('cancel_attendance', { p_session: this.session.id, p_customer: row.customer_id, p_no_show: noShow });
          this.applyResult(row, res);
          await this.refreshBalance(row);
          var txt = res.status === 'cancelled_in_time' ? 'rechtzeitig abgesagt – kein Abzug' :
                    res.status === 'cancelled_late' ? 'zu spät abgesagt' + (res.abgebucht ? ' – 1 Besuch abgezogen' : '') :
                    'nicht erschienen' + (res.abgebucht ? ' – 1 Besuch abgezogen' : '');
          this.notify(this.fullName(row) + ': ' + txt);
        });
      },
      // da, aber ohne Karte – und inzwischen ist Guthaben vorhanden (z. B. gerade verkauft)
      canRebook(r) { return r.status === 'present' && !r.entitlement_id && (r.credits_balance > 0 || r.has_unlimited); },
      async rebook(r) {
        if (r._busy) return;
        r._busy = true;
        try {
          var res = await this.rpc('checkin', { p_session: this.session.id, p_customer: r.customer_id });
          this.applyResult(r, res);
          await this.refreshBalance(r);
          this.notify(res.entitlement_id ? this.fullName(r) + ': Besuch abgebucht' + (res.rest != null && !res.unbegrenzt ? ' · noch ' + res.rest : '')
                                         : 'Keine passende Karte für diese Stunde gefunden.', !res.entitlement_id);
        } catch (e) { this.notify(message(e), true); }
        r._busy = false;
      },
      rowWarn(r) { return (r.status === 'present' && !r.entitlement_id) || (r.status === 'registered' && !r.has_unlimited && !r.credits_balance); },
      rowText(r) {
        if (r.status === 'present') {
          if (!r.entitlement_id) return 'da · ohne Karte';
          if (r.unbegrenzt) return 'da · Kursblock/Abo' + (r.gueltig_bis ? ' bis ' + this.dateShort(r.gueltig_bis) : '');
          return 'da · noch ' + r.rest + (r.von ? ' von ' + r.von : '') + (r.gueltig_bis ? ' · gültig bis ' + this.dateShort(r.gueltig_bis) : '');
        }
        if (r.status === 'cancelled_in_time') return 'rechtzeitig abgesagt';
        if (r.status === 'cancelled_late') return 'zu spät abgesagt' + (r.abgebucht ? ' · abgezogen' : '');
        if (r.status === 'no_show') return 'nicht erschienen' + (r.abgebucht ? ' · abgezogen' : '');
        if (r.has_unlimited) return 'Kursblock/Abo';
        return r.credits_balance ? 'Guthaben ' + r.credits_balance : 'ohne Karte';
      },
      sellFor(r) {
        this.resetSale();
        var c = this.customers.find(function (x) { return x.customer_id === r.customer_id; }) ||
                { customer_id: r.customer_id, first_name: r.first_name, last_name: r.last_name };
        this.sale.customer = c;
        this.sale.backToSession = this.tab === 'checkin' ? this.session : null;
        this.tab = 'verkauf';
      },
      async backToSession() {
        var s = this.sale.backToSession;
        this.resetSale(); this.tab = 'checkin';
        if (s) {
          await this.openSession(s);
          // nach dem Verkauf: wer schon da war, wird jetzt von der neuen Karte abgebucht
          var self = this;
          for (var i = 0; i < this.roster.length; i++) {
            var r = this.roster[i];
            if (r.status === 'present' && !r.entitlement_id) {
              var res = await self.rpc('checkin', { p_session: s.id, p_customer: r.customer_id }).catch(function () { return null; });
              if (res) self.applyResult(r, res);
            }
          }
        }
      },

      // ---------- Kundinnen ----------
      fullName(c) { return [c.first_name, c.last_name].filter(Boolean).join(' '); },
      balanceText(c) { return c.has_unlimited ? 'Kursblock/Abo' : (c.credits_balance ? 'Guthaben ' + c.credits_balance : 'ohne Guthaben'); },
      balanceShort(c) { return c.has_unlimited ? '∞' : String(c.credits_balance || 0); },
      balanceClass(c) { return c.has_unlimited ? '' : !c.credits_balance ? 'ecrm-none' : c.credits_balance <= 1 ? 'ecrm-low' : ''; },
      lastVisitText(c) {
        if (!c.last_visit_at) return 'noch kein Besuch';
        var days = Math.floor((Date.now() - new Date(c.last_visit_at)) / 86400000);
        return days <= 0 ? 'zuletzt heute da' : days === 1 ? 'zuletzt gestern da' : 'zuletzt vor ' + days + ' Tagen da';
      },
      signalLabel(s) { return SIGNALS[s] || s; },
      allTags() {
        var set = {};
        this.customers.forEach(function (c) { (c.tags || []).forEach(function (t) { set[t] = 1; }); });
        return Object.keys(set).sort();
      },
      activeFilterCount() {
        var f = this.f;
        return [f.source, f.balance, f.expiring, f.away, f.archived, f.product, f.tag].filter(Boolean).length;
      },
      resetFilters() { this.f = { source: '', balance: '', expiring: false, away: 0, archived: false, product: '', tag: '' }; },
      filteredCustomers() {
        var f = this.f, q = this.search.trim().toLowerCase(), self = this, now = Date.now();
        return this.customers.filter(function (c) {
          if (!!c.archived_at !== !!f.archived) return false;
          if (q && (self.fullName(c) + ' ' + (c.email || '')).toLowerCase().indexOf(q) === -1) return false;
          if (f.source && c.source !== f.source) return false;
          if (f.balance === '0' && (c.credits_balance !== 0 || c.has_unlimited)) return false;
          if (f.balance === '1' && c.credits_balance !== 1) return false;
          if (f.balance === 'more' && c.credits_balance <= 1) return false;
          if (f.expiring && !(c.next_expiry && new Date(c.next_expiry) - now <= 14 * 86400000)) return false;
          if (f.away && c.last_visit_at && now - new Date(c.last_visit_at) <= f.away * 86400000) return false;
          if (f.away && !c.last_visit_at && now - new Date(c.created_at) <= f.away * 86400000) return false;
          if (f.product && (c.active_products || []).indexOf(f.product) === -1) return false;
          if (f.tag && (c.tags || []).indexOf(f.tag) === -1) return false;
          return true;
        });
      },
      openCustomer(c) { return this.openCustomerById(c.customer_id); },
      async openCustomerById(id) {
        this.tab = 'kundinnen'; this.customerForm = null; this.correctFor = null;
        var r = await this.sb.from('customers').select('*').eq('id', id).single();
        if (r.error) return this.notify(message(r.error), true);
        this.customer = r.data;
        await this.loadCustomerDetail();
        if (!this.team.length) this.loadTeam();
      },
      async loadCustomerDetail() {
        var id = this.customer.id;
        var e = await this.sb.from('v_entitlement_balance').select('*').eq('customer_id', id)
          .order('status').order('expires_at', { ascending: true, nullsFirst: false });
        this.entitlements = e.data || [];
        var h = await this.sb.from('v_customer_history').select('*').eq('customer_id', id)
          .order('occurred_at', { ascending: false }).order('created_at', { ascending: false }).limit(200);
        this.history = h.data || [];
      },
      entText(e) {
        var st = { active: '', used_up: 'aufgebraucht', expired: 'abgelaufen', cancelled: 'storniert' }[e.status];
        var parts = [];
        if (st) parts.push(st);
        if (!e.unlimited && e.product_credits) parts.push('noch ' + e.balance + ' von ' + e.product_credits);
        if (e.expires_at) parts.push((e.status === 'expired' ? 'war gültig bis ' : 'gültig bis ') + this.dateShort(e.expires_at));
        parts.push('gekauft ' + this.dateShort(e.starts_at) + (e.paid_via ? ' · ' + (PAY_WAYS.find(function (w) { return w.value === e.paid_via; }) || {}).label : ''));
        return parts.join(' · ');
      },
      historyText(h) {
        var t = REASONS[h.reason] || h.reason;
        if (h.session_title) t += ' · ' + h.session_title;
        if (h.comment) t += ' – ' + h.comment;
        return t;
      },
      who(id) {
        if (!id) return 'automatisch';
        if (id === this.userId) return 'du';
        var m = this.team.find(function (x) { return x.user_id === id; });
        return m ? m.email.split('@')[0] : 'Team';
      },
      async saveCorrection(e) {
        await this.run(async () => {
          var rest = await this.rpc('correct', { p_entitlement: e.entitlement_id, p_delta: this.correction.delta, p_comment: this.correction.comment });
          this.correctFor = null;
          this.notify('Korrektur gebucht – neues Guthaben ' + rest);
          await this.loadCustomerDetail();
        });
      },
      openCustomerForm(c) {
        this.customerForm = c ? Object.assign({}, c, { tagsText: (c.tags || []).join(', ') })
          : { first_name: this.search.trim(), last_name: '', email: '', phone: '', is_child: false, guardian_name: '', guardian_email: '', guardian_phone: '', tagsText: '', note: '' };
      },
      async saveCustomer() {
        var c = this.customerForm;
        if (!c.first_name) return this.notify('Bitte gib mindestens einen Vornamen ein.', true);
        await this.run(async () => {
          var data = {
            first_name: c.first_name, last_name: c.last_name || null, is_child: !!c.is_child,
            email: c.is_child ? null : (c.email || null), phone: c.is_child ? null : (c.phone || null),
            guardian_name: c.is_child ? (c.guardian_name || null) : null, guardian_email: c.is_child ? (c.guardian_email || null) : null,
            guardian_phone: c.is_child ? (c.guardian_phone || null) : null,
            tags: (c.tagsText || '').split(',').map(function (t) { return t.trim(); }).filter(Boolean), note: c.note || null };
          var r = c.id
            ? await this.sb.from('customers').update(data).eq('id', c.id).select().single()
            : await this.sb.from('customers').insert(Object.assign({ tenant_id: this.tenant.id, source: 'extern' }, data)).select().single();
          if (r.error) throw r.error;
          this.customerForm = null;
          await this.loadCustomers();
          await this.openCustomerById(r.data.id);
          this.notify('Gespeichert.');
        });
      },
      async toggleArchive() {
        await this.run(async () => {
          var r = await this.sb.from('customers').update({ archived_at: this.customer.archived_at ? null : new Date().toISOString() })
            .eq('id', this.customer.id).select().single();
          if (r.error) throw r.error;
          this.customer = r.data;
          this.notify(r.data.archived_at ? 'Archiviert.' : 'Wieder aktiv.');
          this.loadCustomers();
        });
      },
      async anonymize() {
        if (!confirm(this.fullName(this.customer) + ' wirklich löschen?\n\nName und Kontaktdaten werden entfernt. Die Buchungen bleiben anonym erhalten. Das lässt sich nicht rückgängig machen.')) return;
        await this.run(async () => {
          await this.rpc('anonymize_customer', { p_customer: this.customer.id });
          this.customer = null;
          await this.loadCustomers();
          this.notify('Kundin gelöscht.');
        });
      },

      // ---------- Verkauf ----------
      saleMatches() {
        var q = this.sale.search.trim().toLowerCase(), self = this;
        if (q.length < 2) return [];
        return this.customers.filter(function (c) { return !c.archived_at && self.fullName(c).toLowerCase().indexOf(q) > -1; }).slice(0, 8);
      },
      async quickCustomer() {
        var q = this.sale.quick;
        if (!q.first_name) return this.notify('Bitte gib mindestens einen Vornamen ein.', true);
        await this.run(async () => {
          var r = await this.sb.from('customers').insert({ tenant_id: this.tenant.id, first_name: q.first_name, last_name: q.last_name || null, source: 'extern' })
            .select().single();
          if (r.error) throw r.error;
          this.sale.customer = { customer_id: r.data.id, first_name: r.data.first_name, last_name: r.data.last_name };
          this.sale.quick = null;
          this.loadCustomers();
        });
      },
      productText(p) {
        var t = { credits: p.credits + ' Besuche', single: 'Einzelstunde', period: 'Kursblock', subscription: 'Abo unbegrenzt' }[p.type];
        if (p.validity_days) t += ' · ' + p.validity_days + ' Tage gültig';
        if (p.price_cents != null) t += ' · ' + this.euro(p.price_cents);
        if (p.category) t += ' · ' + p.category;
        return t;
      },
      async doSell(paidVia) {
        await this.run(async () => {
          var price = this.sale.price === '' || this.sale.price == null ? null : Math.round(parseFloat(String(this.sale.price).replace(',', '.')) * 100);
          var id = await this.rpc('sell', { p_customer: this.sale.customer.customer_id, p_product: this.sale.product.id, p_paid_via: paidVia, p_price_cents: price });
          var e = await this.sb.from('v_entitlement_balance').select('*').eq('entitlement_id', id).single();
          var name = this.fullName(this.sale.customer);
          var d = e.data;
          this.sale.done = d && !d.unlimited
            ? name + ' hat jetzt ' + d.balance + ' Besuche' + (d.expires_at ? ' · gültig bis ' + this.dateShort(d.expires_at) : '')
            : name + ' hat jetzt ' + this.sale.product.name + (d && d.expires_at ? ' bis ' + this.dateShort(d.expires_at) : '');
          this.loadCustomers();
        });
      },
      resetSale() { this.sale = { search: '', customer: null, product: null, price: '', quick: null, done: '', backToSession: null }; },

      // ---------- Produkte ----------
      openProductForm(p) {
        this.productForm = p ? Object.assign({}, p, { price: p.price_cents != null ? p.price_cents / 100 : '' })
          : { name: '', type: 'credits', credits: 10, validity_days: null, price: '', category: '', active: true };
      },
      async saveProduct() {
        var p = this.productForm;
        if (!p.name) return this.notify('Bitte gib dem Produkt einen Namen.', true);
        await this.run(async () => {
          var data = { name: p.name, validity_days: p.validity_days || null, category: p.category || null, active: !!p.active,
            price_cents: p.price === '' || p.price == null ? null : Math.round(parseFloat(String(p.price).replace(',', '.')) * 100) };
          var r;
          if (p.id) r = await this.sb.from('products').update(data).eq('id', p.id);
          else r = await this.sb.from('products').insert(Object.assign({ tenant_id: this.tenant.id, type: p.type,
            credits: p.type === 'credits' ? p.credits : p.type === 'single' ? 1 : null }, data));
          if (r.error) throw r.error;
          this.productForm = null;
          await this.loadProducts();
          this.notify('Produkt gespeichert.');
        });
      },

      // ---------- Formatierung ----------
      time(iso) { return new Date(iso).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr'; },
      dateShort(iso) { return iso ? new Date(iso).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) : ''; },
      dateLong(iso) { return new Date(iso).toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' }); },
      euro(cents) { return (cents / 100).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' }); }
    };
  }

  // Bibliotheken laden, dann Alpine starten (läuft auch, wenn Flenski die Seite ohne Neuladen erneut anzeigt)
  document.addEventListener('alpine:init', function () { window.Alpine.data('ecrm', component); });
  load(LIB_SUPABASE, function () { return !!window.supabase; })
    .then(function () {
      if (window.Alpine) { window.Alpine.data('ecrm', component); window.Alpine.initTree(root); return; }
      return load(LIB_ALPINE, function () { return !!window.Alpine; });
    })
    .catch(function (e) { boot.textContent = 'Das CRM konnte nicht geladen werden. Bitte Seite neu laden. (' + e.message + ')'; });
})();
</script>
