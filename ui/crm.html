<!--
  Emotional CRM – Oberfläche (Neuausrichtung, Entscheidung 0005)
  Komplett in ein EMBED-WIDGET einer Flenski-Custom-Page einfügen (Widget-Titel aus, Sichtbarkeit "nur Team").
  Nicht ins Fußzeilen-Feld – dort läuft kein Skript (Entscheidung 0001).
  Pro Mandantin nur die Zeile CRM_CONFIG anpassen. Supabase-Adresse und "anon key" sind öffentlich und dürfen hier stehen.
  Alles kommt automatisch aus der App. Regeln (Status, Guthaben, Hinweise) rechnet die Datenbank – hier wird nur angezeigt.
  Regel 11 (CLAUDE.md): keine Funktionen im Alpine-Zustand.
-->
<script>window.CRM_CONFIG = { tenant: "yoga-by-lana" };</script>

<div id="ecrm-root">
  <div class="ecrm-boot" id="ecrm-boot">Deine Menschen werden geladen …</div>

  <div class="ecrm-app" x-data="ecrm" x-cloak>
    <!-- ===== Anmeldung ===== -->
    <template x-if="view === 'login'">
      <div class="ecrm-card ecrm-login">
        <h2 class="ecrm-title">Anmelden</h2>
        <template x-if="!login.codeSent">
          <div>
            <p class="ecrm-muted">Gib deine E-Mail-Adresse ein. Du bekommst einen 6-stelligen Code.</p>
            <input class="ecrm-input" type="email" inputmode="email" autocomplete="email" placeholder="name@beispiel.de"
                   x-model.trim="login.email" @keydown.enter="sendCode()">
            <button class="ecrm-btn ecrm-btn-primary ecrm-block" @click="sendCode()" :disabled="busy">Code senden</button>
          </div>
        </template>
        <template x-if="login.codeSent">
          <div>
            <p class="ecrm-muted">Der Code ist unterwegs an <b x-text="login.email"></b>. Schau auch im Spam-Ordner.</p>
            <input class="ecrm-input ecrm-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6"
                   placeholder="6-stelliger Code" x-model.trim="login.code" @keydown.enter="verifyCode()">
            <button class="ecrm-btn ecrm-btn-primary ecrm-block" @click="verifyCode()" :disabled="busy">Anmelden</button>
            <button class="ecrm-link" @click="login.codeSent = false; login.code = ''">Andere E-Mail-Adresse</button>
          </div>
        </template>
      </div>
    </template>

    <template x-if="view === 'nozugang'">
      <div class="ecrm-card">
        <h2 class="ecrm-title">Kein Zugang</h2>
        <p>Du bist angemeldet als <b x-text="userEmail"></b>, aber für diese App noch nicht freigeschaltet.</p>
        <p class="ecrm-muted">Bitte melde dich bei Systemsafari, dann wirst du eingeladen.</p>
        <button class="ecrm-btn" @click="logout()">Abmelden</button>
      </div>
    </template>

    <!-- ===== App ===== -->
    <template x-if="view === 'app'">
      <div class="ecrm-shell">
        <nav class="ecrm-nav">
          <button :class="tab === 'uebersicht' && 'ecrm-on'" @click="go('uebersicht')">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Übersicht</button>
          <button :class="tab === 'menschen' && 'ecrm-on'" @click="go('menschen')">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.6c2.8.2 4.8 1.9 5.4 5.4"/></svg>Menschen</button>
          <button :class="tab === 'kurse' && 'ecrm-on'" @click="go('kurse')">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Kurse</button>
          <button class="ecrm-gear" :class="tab === 'einstellungen' && 'ecrm-on'" @click="go('einstellungen')" aria-label="Einstellungen">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
        </nav>

        <!-- ================= ÜBERSICHT ================= -->
        <section x-show="tab === 'uebersicht'">
          <div class="ecrm-hello">
            <div class="ecrm-muted" x-text="greeting()"></div>
            <h2 class="ecrm-title">Deine Menschen</h2>
          </div>

          <div class="ecrm-stats">
            <button class="ecrm-stat" @click="openList('')"><span>Alle</span><b x-text="people.length"></b></button>
            <button class="ecrm-stat ecrm-st-dabei" @click="openList('dabei')"><span>Dabei</span><b x-text="count('dabei')"></b></button>
            <button class="ecrm-stat ecrm-st-kuehlt_ab" @click="openList('kuehlt_ab')"><span>Kühlt ab</span><b x-text="count('kuehlt_ab')"></b></button>
            <button class="ecrm-stat ecrm-st-neu" @click="openList('neu')"><span>Neu</span><b x-text="count('neu')"></b></button>
          </div>

          <template x-if="isOwner && setupNeeded().length">
            <button class="ecrm-banner" @click="go('einstellungen')">
              <b x-text="setupNeeded().length + (setupNeeded().length === 1 ? ' Plan' : ' Pläne') + ' aus deiner App noch einrichten'"></b>
              <span>Sag einmal, wie viele Besuche drin sind – dann zählt das CRM die Guthaben automatisch.</span>
            </button>
          </template>

          <h3 class="ecrm-h3">Um diese Menschen kümmerst du dich jetzt</h3>
          <template x-for="c in care.slice(0, careLimit)" :key="c.customer_id">
            <div class="ecrm-card ecrm-care">
              <button class="ecrm-care-main" @click="openPerson(c.customer_id)">
                <span class="ecrm-avatar" :class="'ecrm-st-' + personStatus(c.customer_id)" x-text="initials(person(c.customer_id))"></span>
                <span class="ecrm-grow">
                  <span class="ecrm-name" x-text="fullName(person(c.customer_id))"></span>
                  <span class="ecrm-sub" x-text="reasonText(c.gruende[0], c.customer_id)"></span>
                </span>
              </button>
              <a class="ecrm-btn ecrm-btn-small" :href="messageLink(c.customer_id, c.gruende[0].art)" target="_blank" rel="noopener"
                 x-show="messageLink(c.customer_id, c.gruende[0].art)" x-text="actionLabel(c.gruende[0].art)"></a>
            </div>
          </template>
          <template x-if="!care.length && !loading">
            <p class="ecrm-empty">Gerade braucht niemand besondere Aufmerksamkeit. Schön!</p>
          </template>
          <button class="ecrm-link" x-show="care.length > careLimit" @click="careLimit = 50" x-text="'Alle ' + care.length + ' anzeigen'"></button>

          <h3 class="ecrm-h3">Gerade passiert</h3>
          <div class="ecrm-card ecrm-feed">
            <template x-for="(f, i) in feed.slice(0, 8)" :key="i">
              <button class="ecrm-feed-row" @click="openPerson(f.customer_id)">
                <span class="ecrm-dot" :class="'ecrm-k-' + feedKind(f.art)"></span>
                <span class="ecrm-grow"><b x-text="f.first_name"></b> <span x-text="feedText(f)"></span></span>
                <span class="ecrm-when" x-text="ago(f.am)"></span>
              </button>
            </template>
            <template x-if="!feed.length && !loading"><p class="ecrm-empty">Noch nichts passiert – sobald jemand in der App aktiv ist, siehst du es hier.</p></template>
          </div>
        </section>

        <!-- ================= MENSCHEN: Liste ================= -->
        <section x-show="tab === 'menschen' && !personId && !form">
          <div class="ecrm-searchrow">
            <input class="ecrm-input" type="search" placeholder="Name suchen" x-model="search">
          </div>
          <div class="ecrm-chips">
            <template x-for="s in statusFilters" :key="s.value">
              <button :class="filter === s.value && 'ecrm-on'" @click="filter = s.value"
                      x-text="s.label + ' ' + (s.value ? count(s.value) : people.length)"></button>
            </template>
          </div>
          <template x-for="p in filteredPeople()" :key="p.customer_id">
            <button class="ecrm-card ecrm-person" @click="openPerson(p.customer_id)">
              <span class="ecrm-avatar" :class="'ecrm-st-' + p.status" x-text="initials(p)"></span>
              <span class="ecrm-grow">
                <span class="ecrm-name"><span x-text="fullName(p)"></span>
                  <span class="ecrm-tag" x-show="p.source !== 'flenski'">ohne App</span><span class="ecrm-tag" x-show="p.is_child">Kind</span></span>
                <span class="ecrm-sub" x-text="lastText(p)"></span>
              </span>
              <span class="ecrm-spark" aria-hidden="true">
                <template x-for="(n, i) in (p.events_8w || [])" :key="i"><i :style="barStyle(n, p.events_8w)" :class="'ecrm-st-' + p.status"></i></template>
              </span>
            </button>
          </template>
          <template x-if="!filteredPeople().length && !loading">
            <p class="ecrm-empty" x-text="people.length ? 'Niemand passt zu diesem Filter.' : 'Noch niemand da. Sobald sich jemand in deiner App registriert, erscheint die Person hier automatisch.'"></p>
          </template>
          <button class="ecrm-btn ecrm-block ecrm-quiet" @click="openForm(null)">+ Person ohne App anlegen</button>
        </section>

        <!-- ================= MENSCH: Detail ================= -->
        <section x-show="tab === 'menschen' && personId && !form">
          <template x-if="detail">
            <div>
              <button class="ecrm-link" @click="personId = null">‹ Menschen</button>
              <div class="ecrm-profile">
                <span class="ecrm-avatar ecrm-avatar-l" :class="'ecrm-st-' + detail.eng.status" x-text="initials(detail.eng)"></span>
                <div class="ecrm-grow">
                  <h2 class="ecrm-title" x-text="fullName(detail.eng)"></h2>
                  <div class="ecrm-sub" x-text="profileLine()"></div>
                </div>
              </div>
              <div class="ecrm-pills">
                <span class="ecrm-pill" :class="'ecrm-st-' + detail.eng.status" x-text="statusLabel(detail.eng)"></span>
                <template x-for="t in (detail.c.tags || [])" :key="t"><span class="ecrm-pill" x-text="t"></span></template>
              </div>
              <div class="ecrm-contact">
                <a class="ecrm-btn ecrm-btn-small" x-show="waLink(detail.c)" :href="waLink(detail.c)" target="_blank" rel="noopener">WhatsApp</a>
                <a class="ecrm-btn ecrm-btn-small" x-show="contactMail(detail.c)" :href="'mailto:' + contactMail(detail.c)">E-Mail</a>
                <a class="ecrm-btn ecrm-btn-small" x-show="contactPhone(detail.c)" :href="'tel:' + contactPhone(detail.c)">Anrufen</a>
              </div>

              <div class="ecrm-stats ecrm-stats-3">
                <div class="ecrm-stat"><span>Kursbesuche</span><b x-text="detail.eng.besuche_gesamt"></b></div>
                <div class="ecrm-stat"><span>Guthaben</span><b x-text="balanceShort()"></b></div>
                <div class="ecrm-stat"><span>Aktiv, 30 Tage</span><b x-text="detail.eng.score_30d"></b></div>
              </div>

              <div class="ecrm-card">
                <div class="ecrm-sub">Aktivität, letzte 8 Wochen</div>
                <div class="ecrm-bars">
                  <template x-for="(n, i) in detail.eng.events_8w" :key="i">
                    <i :style="barStyle(n, detail.eng.events_8w, 56)" :class="i >= 6 ? 'ecrm-st-' + detail.eng.status : 'ecrm-st-dabei'"></i>
                  </template>
                </div>
              </div>

              <template x-for="n in detail.notices" :key="n.id">
                <div class="ecrm-card ecrm-notice">
                  <span class="ecrm-grow" x-text="noticeText(n)"></span>
                  <button class="ecrm-btn ecrm-btn-small" @click="resolveNotice(n)">Erledigt</button>
                </div>
              </template>

              <template x-if="detail.ents.length">
                <div>
                  <h3 class="ecrm-h3">Karten und Pläne</h3>
                  <template x-for="e in detail.ents" :key="e.entitlement_id">
                    <div class="ecrm-card ecrm-ent" :class="e.status !== 'active' && 'ecrm-off'">
                      <div class="ecrm-row">
                        <div class="ecrm-grow">
                          <div class="ecrm-name" x-text="e.product_name"></div>
                          <div class="ecrm-sub" x-text="entText(e)"></div>
                        </div>
                        <span class="ecrm-num" x-text="e.unlimited ? '–' : e.balance"></span>
                      </div>
                      <template x-if="isOwner && !e.unlimited && e.status !== 'cancelled'">
                        <div>
                          <button class="ecrm-link ecrm-small" x-show="correctFor !== e.entitlement_id" @click="correctFor = e.entitlement_id; correction = { delta: 1, comment: '' }">Korrigieren</button>
                          <div x-show="correctFor === e.entitlement_id">
                            <div class="ecrm-stepper">
                              <button class="ecrm-btn ecrm-btn-small" @click="correction.delta--">−</button>
                              <b x-text="(correction.delta > 0 ? '+' : '') + correction.delta"></b>
                              <button class="ecrm-btn ecrm-btn-small" @click="correction.delta++">+</button>
                            </div>
                            <input class="ecrm-input" placeholder="Grund (Pflicht), z. B. Kulanz" x-model="correction.comment">
                            <div class="ecrm-actions">
                              <button class="ecrm-btn" @click="correctFor = null">Abbrechen</button>
                              <button class="ecrm-btn ecrm-btn-primary" @click="saveCorrection(e)" :disabled="busy">Buchen</button>
                            </div>
                          </div>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>
              </template>

              <h3 class="ecrm-h3">Verlauf</h3>
              <div class="ecrm-card ecrm-feed">
                <template x-for="(f, i) in detail.feed" :key="i">
                  <div class="ecrm-feed-row">
                    <span class="ecrm-dot" :class="'ecrm-k-' + feedKind(f.art)"></span>
                    <span class="ecrm-grow" x-text="feedText(f, true)"></span>
                    <span class="ecrm-when" x-text="dateShort(f.am)"></span>
                    <span class="ecrm-delta" x-show="f.delta" x-text="(f.delta > 0 ? '+' : '') + f.delta"></span>
                  </div>
                </template>
                <template x-if="!detail.feed.length"><p class="ecrm-empty">Noch keine Aktivität.</p></template>
              </div>

              <details class="ecrm-more">
                <summary>Weitere Aktionen</summary>
                <div class="ecrm-card">
                  <h3 class="ecrm-h3 ecrm-h3-tight">Zahlung von Hand nachtragen</h3>
                  <p class="ecrm-sub">Nur für Zahlungen außerhalb der App (bar, Überweisung …). App-Käufe kommen automatisch.</p>
                  <select class="ecrm-input" x-model="manual.product">
                    <option value="">Produkt wählen …</option>
                    <template x-for="p in products.filter(p => p.active && !p.needs_setup)" :key="p.id"><option :value="p.id" x-text="p.name"></option></template>
                  </select>
                  <div class="ecrm-row2">
                    <select class="ecrm-input" x-model="manual.paid_via">
                      <option value="bar">bar</option><option value="ueberweisung">Überweisung</option><option value="verein">Verein</option>
                      <option value="gutschein">Gutschein</option><option value="sonstiges">sonstiges</option>
                    </select>
                    <input class="ecrm-input" type="number" inputmode="decimal" step="0.01" placeholder="Preis € (optional)" x-model="manual.price">
                  </div>
                  <button class="ecrm-btn ecrm-btn-primary ecrm-block" @click="saveManual()" :disabled="busy || !manual.product">Eintragen</button>
                  <p class="ecrm-sub" x-show="!products.some(p => p.active && !p.needs_setup)">Erst ein Produkt einrichten (Einstellungen).</p>
                </div>
                <div class="ecrm-actions ecrm-spread">
                  <button class="ecrm-btn" @click="openForm(detail.c)">Bearbeiten</button>
                  <button class="ecrm-btn" @click="toggleArchive()" x-text="detail.c.archived_at ? 'Wieder aufnehmen' : 'Ausblenden'"></button>
                  <template x-if="isOwner"><button class="ecrm-btn ecrm-danger" @click="anonymize()">Löschen</button></template>
                </div>
              </details>
            </div>
          </template>
        </section>

        <!-- ================= MENSCH: anlegen / bearbeiten ================= -->
        <section x-show="tab === 'menschen' && form">
          <template x-if="form">
            <div class="ecrm-card">
              <h3 class="ecrm-h3 ecrm-h3-tight" x-text="form.id ? 'Bearbeiten' : 'Person ohne App'"></h3>
              <template x-if="form.source === 'flenski'"><p class="ecrm-sub">Name und E-Mail kommen aus der App und werden dort gepflegt.</p></template>
              <template x-if="form.source !== 'flenski'">
                <div class="ecrm-row2">
                  <label class="ecrm-label">Vorname *<input class="ecrm-input" x-model.trim="form.first_name"></label>
                  <label class="ecrm-label">Nachname<input class="ecrm-input" x-model.trim="form.last_name"></label>
                </div>
              </template>
              <label class="ecrm-check"><input type="checkbox" x-model="form.is_child"> Kind (Kontakt über die Eltern)</label>
              <template x-if="form.is_child">
                <div>
                  <label class="ecrm-label">Name Elternteil<input class="ecrm-input" x-model.trim="form.guardian_name"></label>
                  <div class="ecrm-row2">
                    <label class="ecrm-label">Telefon Eltern<input class="ecrm-input" type="tel" x-model.trim="form.guardian_phone"></label>
                    <label class="ecrm-label">E-Mail Eltern<input class="ecrm-input" type="email" x-model.trim="form.guardian_email"></label>
                  </div>
                </div>
              </template>
              <div class="ecrm-row2">
                <label class="ecrm-label">Telefon<input class="ecrm-input" type="tel" x-model.trim="form.phone"></label>
                <label class="ecrm-label" x-show="form.source !== 'flenski'">E-Mail<input class="ecrm-input" type="email" x-model.trim="form.email"></label>
              </div>
              <label class="ecrm-label">Notiz (nur Organisatorisches)<textarea class="ecrm-input" rows="3" x-model="form.note"></textarea></label>
              <p class="ecrm-hint">Bitte keine Gesundheitsangaben (Verletzungen, Beschwerden) eintragen.</p>
              <div class="ecrm-actions">
                <button class="ecrm-btn" @click="form = null">Abbrechen</button>
                <button class="ecrm-btn ecrm-btn-primary" @click="saveForm()" :disabled="busy">Speichern</button>
              </div>
            </div>
          </template>
        </section>

        <!-- ================= KURSE ================= -->
        <section x-show="tab === 'kurse' && !course">
          <h2 class="ecrm-title">Kurse</h2>
          <div class="ecrm-sub">Termine aus deiner App, mit Anmeldungen.</div>
          <template x-for="g in courseGroups()" :key="g.label">
            <div>
              <h3 class="ecrm-h3" x-text="g.label"></h3>
              <template x-for="s in g.items" :key="s.id">
                <button class="ecrm-card ecrm-course" @click="openCourse(s)">
                  <span class="ecrm-date"><b x-text="dayNum(s.starts_at)"></b><span x-text="weekday(s.starts_at)"></span></span>
                  <span class="ecrm-grow">
                    <span class="ecrm-name" x-text="s.title"></span>
                    <span class="ecrm-sub" x-text="time(s.starts_at) + (s.category ? ' · ' + s.category : '')"></span>
                  </span>
                  <span class="ecrm-fill">
                    <b x-text="(s.n || 0) + (s.capacity ? '/' + s.capacity : '')"></b>
                    <span x-text="new Date(s.starts_at) < new Date() ? 'da' : 'angemeldet'"></span>
                  </span>
                </button>
              </template>
            </div>
          </template>
          <template x-if="!sessions.length && !loading"><p class="ecrm-empty">Noch keine Termine. Kurse und Events aus deiner App erscheinen hier automatisch.</p></template>
          <button class="ecrm-link" @click="showPast = !showPast; loadCourses()" x-text="showPast ? 'Nur kommende Termine' : 'Vergangene Termine zeigen'"></button>
        </section>

        <section x-show="tab === 'kurse' && course">
          <template x-if="course">
            <div>
              <button class="ecrm-link" @click="course = null">‹ Kurse</button>
              <h2 class="ecrm-title" x-text="course.title"></h2>
              <div class="ecrm-sub" x-text="dateLong(course.starts_at) + ', ' + time(course.starts_at) + (course.category ? ' · ' + course.category : '')"></div>
              <div class="ecrm-stats ecrm-stats-3">
                <div class="ecrm-stat"><span>Angemeldet</span><b x-text="roster.filter(r => r.status === 'registered').length"></b></div>
                <div class="ecrm-stat ecrm-st-dabei"><span>Da</span><b x-text="roster.filter(r => r.status === 'present').length"></b></div>
                <div class="ecrm-stat"><span>Plätze</span><b x-text="course.capacity || '–'"></b></div>
              </div>
              <template x-for="r in roster" :key="r.customer_id">
                <div class="ecrm-card ecrm-person ecrm-roster">
                  <button class="ecrm-care-main" @click="openPerson(r.customer_id)">
                    <span class="ecrm-avatar" :class="'ecrm-st-' + personStatus(r.customer_id)" x-text="initials(r)"></span>
                    <span class="ecrm-grow">
                      <span class="ecrm-name" x-text="fullName(r)"></span>
                      <span class="ecrm-sub" x-text="rosterText(r)"></span>
                    </span>
                  </button>
                  <button class="ecrm-more-btn" @click="r._menu = !r._menu" aria-label="Weitere Aktionen">⋯</button>
                  <div class="ecrm-menu" x-show="r._menu" @click.outside="r._menu = false">
                    <button @click="cancelRow(r, false)">Hat abgesagt</button>
                    <button @click="cancelRow(r, true)">Nicht erschienen</button>
                  </div>
                </div>
              </template>
              <template x-if="!roster.length"><p class="ecrm-empty">Noch niemand angemeldet.</p></template>
            </div>
          </template>
        </section>

        <!-- ================= EINSTELLUNGEN ================= -->
        <section x-show="tab === 'einstellungen'">
          <h2 class="ecrm-title">Einstellungen</h2>

          <template x-if="setupNeeded().length">
            <div>
              <h3 class="ecrm-h3">Pläne aus deiner App einrichten</h3>
              <p class="ecrm-sub">Flenski weiß nicht, wie viele Besuche in einem Plan stecken. Sag es einmal – danach zählt das CRM alles automatisch, auch rückwirkend.</p>
              <template x-for="p in setupNeeded()" :key="p.id">
                <div class="ecrm-card">
                  <div class="ecrm-name" x-text="p.name"></div>
                  <template x-if="!isOwner"><p class="ecrm-sub">Das richtet die Inhaberin ein.</p></template>
                  <template x-if="isOwner">
                    <div>
                      <label class="ecrm-label">Was ist das?
                        <select class="ecrm-input" x-model="setup[p.id].type">
                          <option value="credits">Karte mit Besuchen (z. B. 4er, 10er)</option>
                          <option value="period">Kursblock / Zeitraum (ohne Zählen)</option>
                          <option value="subscription">Abo (unbegrenzt)</option>

            <button class="ecrm-btn" @click="logout()">Abmelden</button>

        </section>

</div>

        this._t = setTimeout(function () { self.toast = null; }, 3500);
      },
      async rpc(name, args) { var r = await this.sb.rpc(name, args); if (r.error) throw r.error; return r.data; },
      toTop() { this.$nextTick(function () { if (root.getBoundingClientRect().top < 0) root.scrollIntoView({ block: 'start' }); }); },
      go(t) {
        this.tab = t; this.personId = null; this.detail = null; this.form = null; this.course = null; this.toTop();
        if (t === 'uebersicht' || t === 'menschen') this.loadPeople();
        if (t === 'kurse') this.loadCourses();
        if (t === 'einstellungen') { this.loadProducts(); this.loadTeam(); }
      },
      openList(status) { this.filter = status; this.go('menschen'); },

      // ---------- Laden ----------
      async loadAll() {
        this.loading = true;
        await Promise.all([this.loadPeople(), this.loadProducts(), this.loadCategories()]);
        this.loading = false;
      },
      async loadPeople() {
        var tid = this.tenant.id;
        var res = await Promise.all([
          this.sb.from('v_customer_engagement').select('*').eq('tenant_id', tid),
          this.sb.from('v_customer_overview').select('customer_id,credits_balance,has_unlimited,next_expiry,email,phone').eq('tenant_id', tid),
          this.sb.rpc('care_list', { p_tenant: tid }),
          this.sb.rpc('activity_feed', { p_tenant: tid, p_customer: null, p_limit: 300 })
        ]);
        var ov = {};
        (res[1].data || []).forEach(function (o) { ov[o.customer_id] = o; });
        this.overview = ov;
        this.people = res[0].data || [];
        this.care = res[2].data || [];
        var feed = (res[3].data || []).filter(function (f) { return new Date(f.am) <= new Date(); });
        this.feed = feed;
        var last = {};
        feed.forEach(function (f) { if (!last[f.customer_id] && f.art !== 'angemeldet') last[f.customer_id] = f; });
        this.lastByPerson = last;
      },
      async loadProducts() {
        var r = await this.sb.from('products').select('*').eq('tenant_id', this.tenant.id).order('name');
        this.products = r.data || [];
        var self = this;
        this.products.forEach(function (p) {
          if (p.needs_setup && !self.setup[p.id]) {
            var m = (p.name || '').match(/(\d+)\s*er/i);
            self.setup[p.id] = { type: m ? 'credits' : 'period', credits: m ? +m[1] : 10, validity: null, price: '', category: '' };
          }
        });
      },
      async loadCategories() {
        var r = await this.sb.from('sessions').select('category').eq('tenant_id', this.tenant.id).not('category', 'is', null);
        var set = {};
        (r.data || []).forEach(function (s) { set[s.category] = 1; });
        this.categories = Object.keys(set).sort();
      },
      async loadTeam() { try { this.team = await this.rpc('team_members', { p_tenant: this.tenant.id }); } catch (e) { this.team = []; } },

      // ---------- Übersicht ----------
      greeting() {
        var h = new Date().getHours();
        return (h < 11 ? 'Guten Morgen' : h < 18 ? 'Guten Tag' : 'Guten Abend') + ' · ' + (this.tenant ? this.tenant.name : '');
      },
      count(status) { return this.people.filter(function (p) { return p.status === status; }).length; },
      setupNeeded() { return this.products.filter(function (p) { return p.needs_setup; }); },
      person(id) { return this.people.find(function (p) { return p.customer_id === id; }) || {}; },
      personStatus(id) { return this.person(id).status || 'eingeschlafen'; },
      reasonText(g, id) {
        var d = g.detail || {};
        switch (g.art) {
          case 'kuehlt_ab': return 'seit ' + (d.tage_still != null ? d.tage_still : '?') + ' Tagen still' + this.balanceSuffix(id);
          case 'droht_abzuspringen': return 'lange nicht da, hat noch Guthaben' + this.balanceSuffix(id);
          case 'karte_fast_leer': return 'Karte fast leer – Zeit für die nächste';
          case 'laeuft_bald_ab': return (d.produkt || 'Karte') + ' läuft am ' + this.dateShort(d.gueltig_bis) + ' ab' + (d.rest ? ' · noch ' + d.rest : '');
          case 'neu_dabei': return 'zum ersten Mal da – willkommen heißen';
          case 'neu_in_app': return 'neu in der App seit ' + this.dateShort(d.seit) + ' – willkommen heißen';
          default: return NOTICE[g.art] || g.art;
        }
      },
      balanceSuffix(id) {
        var o = this.overview[id];
        return o && o.credits_balance ? ' · noch ' + o.credits_balance + ' Besuche' : '';
      },
      actionLabel(art) { return art === 'neu_dabei' || art === 'neu_in_app' ? 'Willkommen' : art === 'zahlung_fehlgeschlagen' ? 'Nachfragen' : 'Nachricht'; },
      // Vorbefüllte Nachricht – warm, ohne Überwachungssprache (08, Abschnitt 4)
      messageText(id, art) {
        var p = this.person(id), o = this.overview[id] || {}, vor = p.first_name || '';
        var gruss = '\n\nLiebe Grüße\n' + ((this.tenant.settings && this.tenant.settings.signatur) || this.tenant.name);
        if (art === 'neu_dabei') return 'Hallo ' + vor + ', schön, dass du dabei bist! Wie hat dir die erste Stunde gefallen? Ich freue mich auf das nächste Mal.' + gruss;
        if (art === 'neu_in_app') return 'Hallo ' + vor + ', herzlich willkommen in meiner App! Schön, dass du da bist. Wenn du Fragen hast oder nicht weißt, welcher Kurs zu dir passt, schreib mir einfach.' + gruss;
        if (art === 'karte_fast_leer') return 'Hallo ' + vor + ', deine Karte ist fast aufgebraucht. Soll ich dir eine neue zurücklegen?' + gruss;
        if (art === 'laeuft_bald_ab') return 'Hallo ' + vor + ', kleine Erinnerung: deine Karte läuft bald ab' + (o.credits_balance ? ' und du hast noch ' + o.credits_balance + ' Besuche' : '') + '. Ich freue mich, dich bald zu sehen!' + gruss;
        if (art === 'zahlung_fehlgeschlagen') return 'Hallo ' + vor + ', bei deiner letzten Zahlung in der App hat etwas nicht geklappt. Magst du kurz nachschauen? Bei Fragen melde dich gern.' + gruss;
        return 'Hallo ' + vor + ', ich habe an dich gedacht und wollte einfach mal hallo sagen. Ich würde mich freuen, dich bald wieder zu sehen!' + gruss;
      },
      messageLink(id, art) {
        var o = this.overview[id] || {}, text = encodeURIComponent(this.messageText(id, art));
        var phone = (o.phone || '').replace(/[^\d+]/g, '').replace(/^00/, '+').replace(/^0/, '+49');
        if (phone) return 'https://wa.me/' + phone.replace('+', '') + '?text=' + text;
        var betreff = { neu_in_app: 'Herzlich willkommen', neu_dabei: 'Schön, dass du da warst', karte_fast_leer: 'Deine Karte',
          laeuft_bald_ab: 'Deine Karte', zahlung_fehlgeschlagen: 'Deine Zahlung' }[art] || 'Ich habe an dich gedacht';
        if (o.email) return 'mailto:' + o.email + '?subject=' + encodeURIComponent(betreff) + '&body=' + text;
        return '';
      },
      feedKind(art) {
        if (art === 'besuch') return 'besuch';
        if (art === 'kauf') return 'kauf';
        if (art === 'angemeldet') return 'angemeldet';
        if (['nicht_erschienen', 'abgesagt', 'verfallen'].indexOf(art) > -1) return 'warn';
        return 'app';
      },
      feedText(f, ohneName) {
        var t = f.titel ? '„' + f.titel + '“' : '';
        var s;
        switch (f.art) {
          case 'besuch': s = (ohneName ? 'War da: ' : 'war bei ') + t; break;
          case 'angemeldet': s = (ohneName ? 'Angemeldet: ' : 'hat sich angemeldet: ') + t; break;
          case 'abgesagt': s = (ohneName ? 'Abgesagt: ' : 'hat abgesagt: ') + t; break;
          case 'nicht_erschienen': s = 'Nicht erschienen: ' + t; break;
          case 'kauf': s = (ohneName ? 'Gekauft: ' : 'hat gekauft: ') + t; break;
          case 'korrektur': s = 'Korrektur: ' + (f.titel || ''); break;
          case 'verfallen': s = 'Verfallen: ' + (f.titel || ''); break;
          default:
            var v = APP[f.art] || 'war aktiv';
            s = ohneName ? v.charAt(0).toUpperCase() + v.slice(1).replace(/^Hat /, '') : v;
            if (t) s += ' ' + t;
        }
        return s;
      },

      // ---------- Menschen ----------
      fullName(p) { return [p.first_name, p.last_name].filter(Boolean).join(' ') || 'Unbekannt'; },
      initials(p) { return ((p.first_name || '?').charAt(0) + (p.last_name || '').charAt(0)).toUpperCase(); },
      statusLabel(e) {
        var s = STATUS[e.status] || e.status;
        if ((e.status === 'kuehlt_ab' || e.status === 'eingeschlafen') && e.tage_still != null) s += ' · ' + e.tage_still + ' Tage still';
        return s;
      },
      filteredPeople() {
        var q = this.search.trim().toLowerCase(), f = this.filter, ov = this.overview, self = this;
        var rank = { kuehlt_ab: 0, neu: 1, dabei: 2, eingeschlafen: 3 };
        return this.people
          .filter(function (p) { return (!f || p.status === f) && (!q || self.fullName(p).toLowerCase().indexOf(q) > -1); })
          .sort(function (a, b) {
            return (rank[a.status] - rank[b.status])
              || (((ov[b.customer_id] || {}).credits_balance || 0) - ((ov[a.customer_id] || {}).credits_balance || 0))
              || self.fullName(a).localeCompare(self.fullName(b));
          });
      },
      lastText(p) {
        var l = this.lastByPerson[p.customer_id];
        if (!l && p.status === 'neu') return 'neu dabei seit ' + this.dateShort(p.joined_at);
        if (!l) return 'noch keine Aktivität';
        return this.ago(l.am) + ' · ' + this.feedText(l, true);
      },
      barStyle(n, arr, h) {
        var max = Math.max.apply(null, (arr || []).concat([1]));
        return 'height:' + Math.max(n ? 12 : 4, Math.round(n / max * 100)) + '%';
      },
      async openPerson(id) {
        this.tab = 'menschen'; this.personId = id; this.form = null; this.correctFor = null; this.detail = null; this.toTop();
        this.manual = { product: '', paid_via: 'bar', price: '' };
        await this.loadDetail();
      },
      async loadDetail() {
        var id = this.personId, tid = this.tenant.id;
        var res = await Promise.all([
          this.sb.from('customers').select('*').eq('id', id).single(),
          this.sb.from('v_customer_engagement').select('*').eq('customer_id', id).maybeSingle(),
          this.sb.from('v_entitlement_balance').select('*').eq('customer_id', id).order('status').order('starts_at', { ascending: false }),
          this.sb.rpc('activity_feed', { p_tenant: tid, p_customer: id, p_limit: 100 }),
          this.sb.from('customer_notices').select('*').eq('customer_id', id).is('resolved_at', null).order('created_at', { ascending: false })
        ]);
        if (res[0].error) return this.notify(message(res[0].error), true);
        var c = res[0].data;
        var eng = res[1].data || { status: 'eingeschlafen', first_name: c.first_name, last_name: c.last_name, events_8w: [0, 0, 0, 0, 0, 0, 0, 0], besuche_gesamt: 0, score_30d: 0 };
        this.detail = { c: c, eng: eng, ents: res[2].data || [], feed: res[3].data || [], notices: res[4].data || [] };
      },
      profileLine() {
        var c = this.detail.c, e = this.detail.eng;
        var parts = [c.source === 'flenski' ? 'App-Mitglied seit ' + this.dateShort(e.joined_at || c.joined_at) : 'ohne App'];
        if (c.is_child) parts.push('Kind' + (c.guardian_name ? ', Eltern: ' + c.guardian_name : ''));
        return parts.join(' · ');
      },
      contactMail(c) { return c.is_child ? c.guardian_email : c.email; },
      contactPhone(c) { return c.is_child ? c.guardian_phone : c.phone; },
      waLink(c) {
        var p = (this.contactPhone(c) || '').replace(/[^\d+]/g, '').replace(/^00/, '+').replace(/^0/, '+49');
        return p ? 'https://wa.me/' + p.replace('+', '') : '';
      },
      balanceShort() {
        var o = this.overview[this.personId] || {}, products = this.products;
        // Pläne, die noch nicht eingerichtet sind, zählen noch nicht – sonst stünde dort fälschlich "Block"
        var offen = function (e) { var p = products.find(function (x) { return x.id === e.product_id; }); return p && p.needs_setup; };
        var aktiv = this.detail.ents.filter(function (e) { return e.status === 'active' && !offen(e); });
        if (aktiv.some(function (e) { return e.unlimited; })) return 'Block';
        var hasCard = aktiv.some(function (e) { return !e.unlimited; });
        return hasCard ? String(o.credits_balance || 0) : '–';
      },
      entText(e) {
        var st = { active: '', used_up: 'aufgebraucht', expired: 'abgelaufen', cancelled: 'storniert' }[e.status];
        var parts = [];
        if (st) parts.push(st);
        var prod = this.products.find(function (p) { return p.id === e.product_id; });
        if (prod && prod.needs_setup) parts.push('noch nicht eingerichtet');
        else if (!e.unlimited && e.product_credits) parts.push('noch ' + e.balance + ' von ' + e.product_credits);
        if (e.expires_at) parts.push('gültig bis ' + this.dateShort(e.expires_at));
        parts.push((e.paid_via === 'app' ? 'in der App' : 'von Hand') + ' am ' + this.dateShort(e.starts_at));
        return parts.join(' · ');
      },
      noticeText(n) {
        var d = n.detail || {};
        var t = NOTICE[n.kind] || n.kind;
        if (d.plan) t += ': ' + d.plan;
        if (d.produkt) t += ': ' + d.produkt;
        return t.charAt(0).toUpperCase() + t.slice(1);
      },
      async resolveNotice(n) {
        await this.run(async () => {
          var r = await this.sb.from('customer_notices').update({ resolved_at: new Date().toISOString(), resolved_by: this.userId }).eq('id', n.id);
          if (r.error) throw r.error;
          this.detail.notices = this.detail.notices.filter(function (x) { return x.id !== n.id; });
          this.loadPeople();
        });
      },
      async saveCorrection(e) {
        await this.run(async () => {
          var rest = await this.rpc('correct', { p_entitlement: e.entitlement_id, p_delta: this.correction.delta, p_comment: this.correction.comment });
          this.correctFor = null;
          this.notify('Korrektur gebucht – neues Guthaben ' + rest);
          await Promise.all([this.loadDetail(), this.loadPeople()]);
        });
      },
      async saveManual() {
        await this.run(async () => {
          var price = this.manual.price === '' ? null : Math.round(parseFloat(String(this.manual.price).replace(',', '.')) * 100);
          await this.rpc('sell', { p_customer: this.personId, p_product: this.manual.product, p_paid_via: this.manual.paid_via, p_price_cents: price });
          this.manual = { product: '', paid_via: 'bar', price: '' };
          this.notify('Eingetragen.');
          await Promise.all([this.loadDetail(), this.loadPeople()]);
        });
      },
      openForm(c) {
        this.toTop();
        this.form = c ? Object.assign({}, c) : { source: 'extern', first_name: this.search.trim(), last_name: '', email: '', phone: '', is_child: false,
          guardian_name: '', guardian_email: '', guardian_phone: '', note: '' };
      },
      async saveForm() {
        var f = this.form;
        if (f.source !== 'flenski' && !f.first_name) return this.notify('Bitte gib mindestens einen Vornamen ein.', true);
        await this.run(async () => {
          var data = { is_child: !!f.is_child, phone: f.phone || null, note: f.note || null,
            guardian_name: f.is_child ? (f.guardian_name || null) : null, guardian_email: f.is_child ? (f.guardian_email || null) : null,
            guardian_phone: f.is_child ? (f.guardian_phone || null) : null };
          if (f.source !== 'flenski') Object.assign(data, { first_name: f.first_name, last_name: f.last_name || null, email: f.email || null });
          var r = f.id
            ? await this.sb.from('customers').update(data).eq('id', f.id).select().single()
            : await this.sb.from('customers').insert(Object.assign({ tenant_id: this.tenant.id, source: 'extern' }, data)).select().single();
          if (r.error) throw r.error;
          this.form = null;
          await this.loadPeople();
          await this.openPerson(r.data.id);
          this.notify('Gespeichert.');
        });
      },
      async toggleArchive() {
        await this.run(async () => {
          var r = await this.sb.from('customers').update({ archived_at: this.detail.c.archived_at ? null : new Date().toISOString() })
            .eq('id', this.personId).select().single();
          if (r.error) throw r.error;
          this.notify(r.data.archived_at ? 'Ausgeblendet – die Person erscheint nicht mehr in den Listen.' : 'Wieder aufgenommen.');
          this.personId = null; await this.loadPeople();
        });
      },
      async anonymize() {
        if (!confirm(this.fullName(this.detail.c) + ' wirklich löschen?\n\nName und Kontaktdaten werden entfernt. Buchungen bleiben anonym erhalten. Das lässt sich nicht rückgängig machen.')) return;
        await this.run(async () => {
          await this.rpc('anonymize_customer', { p_customer: this.personId });
          this.personId = null;
          await this.loadPeople();
          this.notify('Gelöscht.');
        });
      },

      // ---------- Kurse ----------
      async loadCourses() {
        var from = new Date(); from.setHours(0, 0, 0, 0);
        if (this.showPast) from.setDate(from.getDate() - 60);
        var q = this.sb.from('sessions').select('*').eq('tenant_id', this.tenant.id).gte('starts_at', from.toISOString()).order('starts_at').limit(80);
        var r = await q;
        var list = r.data || [];
        if (list.length) {
          var a = await this.sb.from('attendances').select('session_id,status').in('status', ['registered', 'present']).in('session_id', list.map(function (s) { return s.id; }));
          var n = {};
          (a.data || []).forEach(function (x) { n[x.session_id] = (n[x.session_id] || 0) + 1; });
          list.forEach(function (s) { s.n = n[s.id] || 0; });
        }
        this.sessions = list;
      },
      courseGroups() {
        var groups = [], map = {}, self = this;
        this.sessions.forEach(function (s) {
          var d = new Date(s.starts_at), label = self.weekLabel(d);
          if (!map[label]) { map[label] = { label: label, items: [] }; groups.push(map[label]); }
          map[label].items.push(s);
        });
        return groups;
      },
      weekLabel(d) {
        var today = new Date(); today.setHours(0, 0, 0, 0);
        var monday = function (x) { var m = new Date(x); m.setHours(0, 0, 0, 0); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); return m; };
        var diff = Math.round((monday(d) - monday(today)) / (7 * 86400000));
        if (diff === 0) return 'Diese Woche';
        if (diff === 1) return 'Nächste Woche';
        if (diff === -1) return 'Letzte Woche';
        return 'Woche ab ' + monday(d).toLocaleDateString('de-DE', { day: 'numeric', month: 'long' });
      },
      async openCourse(s) {
        this.course = s; this.toTop();
        try {
          var rows = await this.rpc('session_roster', { p_session: s.id });
          this.roster = rows.filter(function (r) { return true; }).map(function (r) { r._menu = false; return r; });
        } catch (e) { this.notify(message(e), true); }
      },
      rosterText(r) {
        if (r.status === 'present') return 'war da' + (r.abgebucht && r.rest != null ? ' · noch ' + r.rest + (r.von ? ' von ' + r.von : '') : '');
        if (r.status === 'registered') return 'angemeldet' + (r.credits_balance ? ' · Guthaben ' + r.credits_balance : '');
        if (r.status === 'cancelled_in_time') return 'abgesagt';
        if (r.status === 'cancelled_late') return 'zu spät abgesagt' + (r.abgebucht ? ' · abgezogen' : '');
        return 'nicht erschienen' + (r.abgebucht ? ' · abgezogen' : '');
      },
      async cancelRow(r, noShow) {
        r._menu = false;
        await this.run(async () => {
          await this.rpc('cancel_attendance', { p_session: this.course.id, p_customer: r.customer_id, p_no_show: noShow });
          this.notify(this.fullName(r) + (noShow ? ': nicht erschienen' : ': abgesagt'));
          await this.openCourse(this.course);
        });
      },

      // ---------- Einstellungen ----------
      async saveSetup(p) {
        var s = this.setup[p.id];
        if (s.type === 'credits' && !(s.credits > 0)) return this.notify('Bitte gib an, wie viele Besuche drin sind.', true);
        await this.run(async () => {
          var price = s.price === '' || s.price == null ? null : Math.round(parseFloat(String(s.price).replace(',', '.')) * 100);
          var n = await this.rpc('setup_product', { p_product: p.id, p_type: s.type, p_credits: s.type === 'credits' ? s.credits : null,
            p_validity_days: s.validity || null, p_price_cents: price, p_category: s.category || null });
          this.notify(p.name + ' eingerichtet' + (n ? ' – ' + n + (n === 1 ? ' Karte' : ' Karten') + ' nachgezogen' : '') + '.');
          await Promise.all([this.loadProducts(), this.loadPeople()]);
        });
      },
      productText(p) {
        var t = { credits: p.credits + ' Besuche', single: 'Einzelstunde', period: 'Kursblock', subscription: 'Abo' }[p.type];
        if (p.validity_days) t += ' · ' + p.validity_days + ' Tage';
        if (p.price_cents != null) t += ' · ' + (p.price_cents / 100).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' });
        if (p.category) t += ' · ' + p.category;
        return t;
      },

      // ---------- Formatierung ----------
      ago(iso) {
        var d = days(iso);
        if (d <= 0) return 'heute';
        if (d === 1) return 'gestern';
        if (d < 30) return 'vor ' + d + ' Tagen';
        return this.dateShort(iso);
      },
      time(iso) { return new Date(iso).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr'; },
      dateShort(iso) { return iso ? new Date(iso).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) : ''; },
      dateLong(iso) { return new Date(iso).toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' }); },
      dayNum(iso) { return new Date(iso).getDate(); },
      weekday(iso) { return new Date(iso).toLocaleDateString('de-DE', { weekday: 'short' }).replace('.', ''); }
    };
  }

  document.addEventListener('alpine:init', function () { window.Alpine.data('ecrm', component); });
  load(LIB_SUPABASE, function () { return !!window.supabase; })
    .then(function () {
      if (window.Alpine) { window.Alpine.data('ecrm', component); window.Alpine.initTree(root); return; }
      return load(LIB_ALPINE, function () { return !!window.Alpine; });
    })
    .catch(function (e) { boot.textContent = 'Das CRM konnte nicht geladen werden. Bitte Seite neu laden. (' + e.message + ')'; });
})();
</script>
