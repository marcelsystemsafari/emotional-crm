<!--
  Emotional CRM – Oberfläche (Entwurf v2, freigegeben von Marcel am 22.10.2026)
  Komplett in ein EMBED-WIDGET einer Flenski-Custom-Page einfügen (Widget-Titel aus, Sichtbarkeit "nur Team").
  Nicht ins Fußzeilen-Feld – dort läuft kein Skript (Entscheidung 0001).
  Pro Mandantin nur die Zeile CRM_CONFIG anpassen. Supabase-Adresse und "anon key" sind öffentlich und dürfen hier stehen.
  Alles kommt automatisch aus der App. Regeln (Status, Guthaben, Hinweise) rechnet die Datenbank – hier wird nur angezeigt.
  Regel 11 (CLAUDE.md): keine Funktionen im Alpine-Zustand.
-->
<script>window.CRM_CONFIG = { tenant: "yoga-by-lana" };</script>

<div id="ecrm-root" lang="de">
  <div class="ecrm-boot" id="ecrm-boot">
    <div class="ecrm-skel" aria-label="Wird geladen">
      <div class="ecrm-skel-nav"><i></i><i></i><i></i><i></i></div>
      <div class="ecrm-skel-hero"><i style="width:28%"></i><i class="ecrm-skel-big" style="width:52%"></i><i style="width:68%"></i></div>
      <div class="ecrm-skel-card"><i style="width:34%"></i><i class="ecrm-skel-bar"></i><i style="width:78%"></i><i style="width:62%"></i></div>
      <div class="ecrm-skel-card"><i style="width:40%"></i><i style="width:85%"></i><i style="width:70%"></i></div>
      <p class="ecrm-skel-text">Deine Menschen werden geladen …</p>
    </div>
  </div>

  <div class="ecrm-app" x-data="ecrm" x-cloak>
    <div x-show="view === 'boot' || (view === 'app' && !ready)">
    <div class="ecrm-skel" aria-label="Wird geladen">
      <div class="ecrm-skel-nav"><i></i><i></i><i></i><i></i></div>
      <div class="ecrm-skel-hero"><i style="width:28%"></i><i class="ecrm-skel-big" style="width:52%"></i><i style="width:68%"></i></div>
      <div class="ecrm-skel-card"><i style="width:34%"></i><i class="ecrm-skel-bar"></i><i style="width:78%"></i><i style="width:62%"></i></div>
      <div class="ecrm-skel-card"><i style="width:40%"></i><i style="width:85%"></i><i style="width:70%"></i></div>
      <p class="ecrm-skel-text">Deine Menschen werden geladen …</p>
    </div>
    </div>
    <!-- ===== Anmeldung ===== -->
    <template x-if="view === 'login'">
      <div class="ecrm-card ecrm-login">
        <div class="ecrm-serif ecrm-login-title">Willkommen</div>
        <template x-if="!login.codeSent">
          <div>
            <p class="ecrm-text">Gib deine E-Mail-Adresse ein. Du bekommst einen 6-stelligen Code.</p>
            <input class="ecrm-input" type="email" inputmode="email" autocomplete="email" placeholder="name@beispiel.de"
                   x-model.trim="login.email" @keydown.enter="sendCode()">
            <button class="ecrm-btn ecrm-btn-primary ecrm-block" @click="sendCode()" :disabled="busy">Code senden</button>
          </div>
        </template>
        <template x-if="login.codeSent">
          <div>
            <p class="ecrm-text">Der Code ist unterwegs an <b x-text="login.email"></b>. Schau auch im Spam-Ordner.</p>
            <input class="ecrm-input ecrm-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6"
                   placeholder="6-stelliger Code" x-model.trim="login.code" @keydown.enter="verifyCode()">
            <button class="ecrm-btn ecrm-btn-primary ecrm-block" @click="verifyCode()" :disabled="busy">Anmelden</button>
            <button class="ecrm-link" @click="login.codeSent = false; login.code = ''">Andere E-Mail-Adresse</button>
          </div>
        </template>
      </div>
    </template>

    <template x-if="view === 'nozugang'">
      <div class="ecrm-card">
        <div class="ecrm-serif ecrm-login-title">Kein Zugang</div>
        <p class="ecrm-text">Du bist angemeldet als <b x-text="userEmail"></b>, aber für diese App noch nicht freigeschaltet. Bitte melde dich bei Systemsafari.</p>
        <button class="ecrm-btn" @click="logout()">Abmelden</button>
      </div>
    </template>

    <!-- ===== App ===== -->
    <template x-if="view === 'app'">
      <div x-show="ready">
        <nav class="ecrm-nav">
          <button :class="tab === 'heute' && 'ecrm-on'" @click="go('heute')">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg><span>Übersicht</span></button>
          <button :class="tab === 'menschen' && 'ecrm-on'" @click="go('menschen')">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.6c2.8.2 4.8 1.9 5.4 5.4"/></svg><span>Menschen</span></button>
          <button :class="tab === 'kurse' && 'ecrm-on'" @click="go('kurse')">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Kurse</span></button>
          <button :class="tab === 'angebote' && 'ecrm-on'" @click="go('angebote')">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16v12H4z"/><path d="M8 7V5h8v2M4 12h16"/></svg><span>Angebote</span>
            <i class="ecrm-badge" x-show="setupNeeded().length" x-text="setupNeeded().length" title="Angebote noch nicht verbunden"></i></button>
        </nav>

        <!-- ================= ÜBERSICHT ================= -->
        <section x-show="tab === 'heute'">
          <div class="ecrm-hero">
            <img class="ecrm-hero-logo" x-show="logoUrl()" :src="logoUrl()" alt="">
            <div class="ecrm-hero-date" x-text="todayLong()"></div>
            <div class="ecrm-serif ecrm-hero-hello" x-text="greeting()"></div>
            <div class="ecrm-hero-line" x-text="heroLine()"></div>
            <div class="ecrm-hero-facts">
              <button @click="go('kurse')"><b x-text="upcomingRegistrations()"></b> <span x-text="upcomingRegistrations() === 1 ? 'Anmeldung für deine Kurse' : 'Anmeldungen für deine Kurse'"></span></button>
              <button @click="openList('')"><b x-text="purchases7()"></b> <span x-text="purchases7() === 1 ? 'Kauf in 7 Tagen' : 'Käufe in 7 Tagen'"></span></button>
            </div>
          </div>

          <div class="ecrm-card ecrm-section ecrm-mix">
            <div class="ecrm-section-head ecrm-mix-head">
              <div class="ecrm-h" x-text="'Deine ' + people.length + (people.length === 1 ? ' Mensch' : ' Menschen')"></div>
              <button class="ecrm-link ecrm-link-s" @click="openList('')">Alle ansehen ›</button>
            </div>
            <div class="ecrm-mixbar" x-show="people.length">
              <template x-for="m in mix" :key="m.status">
                <i :class="'ecrm-st-' + m.status" :style="'flex-grow:' + count(m.status)" x-show="count(m.status)"></i>
              </template>
            </div>
            <div class="ecrm-mix-rows">
            <template x-for="m in mix" :key="m.status">
              <button class="ecrm-mix-row" @click="openList(m.status)">
                <span class="ecrm-mix-dot" :class="'ecrm-st-' + m.status"></span>
                <span class="ecrm-grow"><b x-text="m.label"></b><span class="ecrm-text-s" x-text="m.hint"></span></span>
                <span class="ecrm-mix-num" x-text="count(m.status)"></span>
              </button>
            </template>
            </div>
          </div>

          <template x-if="isOwner && setupNeeded().length">
            <button class="ecrm-banner" @click="go('angebote')">
              <b x-text="setupNeeded().length + (setupNeeded().length === 1 ? ' Angebot' : ' Angebote') + ' aus deiner App verbinden'"></b>
              <span>Ein Tipp pro Angebot – dann zählt das CRM die Besuche auf Karten automatisch.</span>
            </button>
          </template>

          <div class="ecrm-grid"><div>
          <div class="ecrm-card ecrm-section">
            <div class="ecrm-section-head">
              <div class="ecrm-h">Heute für dich</div>
              <div class="ecrm-text-s">Menschen, bei denen eine kurze Nachricht gerade viel bewirkt.</div>
            </div>
            <template x-for="c in care.slice(0, careLimit)" :key="c.customer_id">
              <div class="ecrm-item">
                <button class="ecrm-item-main" @click="openPerson(c.customer_id)">
                  <span class="ecrm-ava" :class="'ecrm-st-' + personStatus(c.customer_id)">
                    <span x-text="initials(person(c.customer_id))"></span>
                    <img x-show="person(c.customer_id).avatar_url" :src="person(c.customer_id).avatar_url" alt="" loading="lazy">
                  </span>
                  <span class="ecrm-grow">
                    <span class="ecrm-name" x-text="fullName(person(c.customer_id))"></span>
                    <span class="ecrm-text-s" x-text="careText(c)"></span>
                  </span>
                </button>
                <button class="ecrm-btn ecrm-btn-soft" x-show="c.gruende[0].art === 'teilnahme_unklar'" @click="openCourseId(c.gruende[0].detail.session_id)">Prüfen</button>
                <a class="ecrm-btn ecrm-btn-soft" x-show="c.gruende[0].art !== 'teilnahme_unklar' && profileUrl(c.customer_id)" :href="profileUrl(c.customer_id)" target="_top"
                   x-text="actionLabel(c.gruende[0].art)"></a>
              </div>
            </template>
            <template x-if="!care.length && !loading">
              <p class="ecrm-empty">Gerade braucht niemand besondere Aufmerksamkeit. Schön!</p>
            </template>
            <button class="ecrm-link" x-show="care.length > careLimit" @click="careLimit = 50" x-text="'Alle ' + care.length + ' anzeigen'"></button>
          </div>

          <div class="ecrm-card ecrm-section" x-show="nextSessions().length">
            <div class="ecrm-section-head">
              <div class="ecrm-h">Deine nächsten Kurse</div>
              <div class="ecrm-text-s">Wie voll deine kommenden Termine schon sind.</div>
            </div>
            <template x-for="s in nextSessions()" :key="s.id">
              <button class="ecrm-item ecrm-item-btn" @click="openCourse(s)">
                <span class="ecrm-date-s" x-text="dateShort(s.starts_at)"></span>
                <span class="ecrm-grow ecrm-name ecrm-name-n" x-text="s.title"></span>
                <span class="ecrm-fillbar"><i :style="'width:' + fillPct(s) + '%'"></i></span>
                <span class="ecrm-text-s ecrm-nowrap" x-text="(s.n || 0) + (s.capacity ? ' von ' + s.capacity : '')"></span>
              </button>
            </template>
          </div>

          </div><div>
          <div class="ecrm-card ecrm-section">
            <div class="ecrm-section-head">
              <div class="ecrm-h">Gerade passiert</div>
              <div class="ecrm-text-s">Was deine Menschen zuletzt in der App und in deinen Kursen gemacht haben.</div>
            </div>
            <template x-for="(f, i) in feed.slice(0, 8)" :key="i">
              <button class="ecrm-item ecrm-item-btn" @click="openPerson(f.customer_id)">
                <span class="ecrm-ava ecrm-ava-s" :class="'ecrm-st-' + personStatus(f.customer_id)">
                  <span x-text="initials(person(f.customer_id))"></span>
                  <img x-show="person(f.customer_id).avatar_url" :src="person(f.customer_id).avatar_url" alt="" loading="lazy">
                </span>
                <span class="ecrm-grow ecrm-feedtext"><b x-text="f.first_name"></b> <span x-text="feedText(f)"></span></span>
                <span class="ecrm-when" x-text="ago(f.am)"></span>
              </button>
            </template>
            <template x-if="!feed.length && !loading"><p class="ecrm-empty">Noch nichts passiert. Sobald jemand in der App aktiv ist, siehst du es hier.</p></template>
          </div>
          </div></div>
        </section>

        <!-- ================= MENSCHEN ================= -->
        <section class="ecrm-narrow" x-show="tab === 'menschen' && !personId && !form">
          <div class="ecrm-page-head">
            <div class="ecrm-serif ecrm-page-title">Menschen</div>
            <div class="ecrm-text-s">Alle aus deiner App – oben, wer still wird, dann die Neuen, dann die Aktiven.</div>
          </div>
          <input class="ecrm-input" type="search" placeholder="Name suchen" x-model="search">
          <div class="ecrm-chips">
            <template x-for="s in statusFilters" :key="s.value">
              <button :class="filter === s.value && 'ecrm-on'" @click="filter = s.value" x-text="s.label + ' · ' + (s.value ? count(s.value) : people.length)"></button>
            </template>
          </div>
          <div class="ecrm-card ecrm-section">
            <template x-for="p in filteredPeople()" :key="p.customer_id">
              <button class="ecrm-item ecrm-item-btn" @click="openPerson(p.customer_id)">
                <span class="ecrm-ava" :class="'ecrm-st-' + p.status">
                  <span x-text="initials(p)"></span><img x-show="p.avatar_url" :src="p.avatar_url" alt="" loading="lazy">
                </span>
                <span class="ecrm-grow">
                  <span class="ecrm-name"><span x-text="fullName(p)"></span>
                    <i class="ecrm-chip" :class="'ecrm-st-' + p.status" x-text="statusShort(p.status)"></i></span>
                  <span class="ecrm-text-s" x-text="lastText(p)"></span>
                </span>
                <span class="ecrm-spark" aria-hidden="true">
                  <template x-for="(n, i) in (p.events_8w || [])" :key="i"><i :style="barStyle(n, p.events_8w)" :class="'ecrm-st-' + p.status"></i></template>
                </span>
              </button>
            </template>
            <template x-if="!filteredPeople().length && !loading">
              <p class="ecrm-empty" x-text="people.length ? 'Niemand passt zu diesem Filter.' : 'Noch niemand da. Sobald sich jemand in deiner App registriert, erscheint die Person hier automatisch.'"></p>
            </template>
          </div>
          <p class="ecrm-legend">Die kleinen Balken zeigen die Aktivität der letzten 8 Wochen – App und Kurse zusammen, rechts ist die aktuelle Woche.</p>
        </section>

        <!-- ================= MENSCH: Detail ================= -->
        <section x-show="tab === 'menschen' && personId && !form">
          <template x-if="detail">
            <div>
              <button class="ecrm-back" @click="personId = null">‹ Alle Menschen</button>
              <div class="ecrm-grid ecrm-grid-detail"><div>
              <div class="ecrm-card ecrm-profile">
                <span class="ecrm-ava ecrm-ava-l" :class="'ecrm-st-' + detail.eng.status">
                  <span x-text="initials(detail.eng)"></span><img x-show="detail.c.avatar_url" :src="detail.c.avatar_url" alt="">
                </span>
                <div class="ecrm-serif ecrm-profile-name" x-text="fullName(detail.eng)"></div>
                <span class="ecrm-chip ecrm-chip-l" :class="'ecrm-st-' + detail.eng.status" x-text="statusLong(detail.eng)"></span>
                <p class="ecrm-text ecrm-center ecrm-summary" x-text="summary()"></p>
                <div class="ecrm-profile-actions">
                  <a class="ecrm-btn ecrm-btn-primary" x-show="profileUrl(personId)" :href="profileUrl(personId)" target="_top"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H10l-4 3.5V16H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg>Profil &amp; Nachricht in der App</a>
                </div>
              </div>

              <div class="ecrm-kpis">
                <div><b x-text="detail.eng.besuche_gesamt"></b><span>Kursbesuche</span></div>
                <div><b x-text="balanceShort()"></b><span x-text="balanceLabel()"></span></div>
                <div><b x-text="detail.eng.score_30d"></b><span>Aktivität, 30 Tage</span></div>
              </div>
              <p class="ecrm-legend">Aktivität, 30 Tage: Punkte für Kursbesuche (3), Kurse, Beiträge und Kommentare (2), Lesen und Downloads (1).</p>

              <div class="ecrm-card ecrm-section">
                <div class="ecrm-section-head">
                  <div class="ecrm-h">Aktivität der letzten 8 Wochen</div>
                  <div class="ecrm-text-s">App und Kurse zusammen. Rechts ist die aktuelle Woche.</div>
                </div>
                <div class="ecrm-bars">
                  <template x-for="(n, i) in detail.eng.events_8w" :key="i">
                    <span class="ecrm-bar"><i :style="barStyle(n, detail.eng.events_8w)" :class="'ecrm-st-' + detail.eng.status"></i><small x-text="i === 7 ? 'jetzt' : (i === 0 ? 'vor 8 W.' : '')"></small></span>
                  </template>
                </div>
              </div>

              <template x-for="n in detail.notices" :key="n.id">
                <div class="ecrm-card ecrm-notice">
                  <span class="ecrm-grow" x-text="noticeText(n)"></span>
                  <button class="ecrm-btn ecrm-btn-soft" @click="resolveNotice(n)">Erledigt</button>
                </div>
              </template>

              </div><div>
              <template x-if="detail.ents.length">
                <div class="ecrm-card ecrm-section">
                  <div class="ecrm-section-head">
                    <div class="ecrm-h">Gekaufte Angebote</div>
                    <div class="ecrm-text-s">Aus der App übernommen. Bei Karten siehst du, wie viele Besuche noch übrig sind.</div>
                  </div>
                  <template x-for="e in detail.ents" :key="e.entitlement_id">
                    <div class="ecrm-item ecrm-item-col" :class="e.status !== 'active' && 'ecrm-off'">
                      <div class="ecrm-item-row">
                        <span class="ecrm-grow">
                          <span class="ecrm-name" x-text="e.product_name"></span>
                          <span class="ecrm-text-s" x-text="entText(e)"></span>
                        </span>
                        <span class="ecrm-num" x-text="entNumber(e)"></span>
                      </div>
                      <template x-if="isOwner && !e.unlimited && e.status !== 'cancelled' && !entOpen(e)">
                        <div>
                          <button class="ecrm-link ecrm-link-s" x-show="correctFor !== e.entitlement_id" @click="correctFor = e.entitlement_id; correction = { delta: 1, comment: '' }">Besuche korrigieren</button>
                          <div x-show="correctFor === e.entitlement_id" class="ecrm-correct">
                            <div class="ecrm-stepper">
                              <button class="ecrm-btn ecrm-btn-soft" @click="correction.delta--">−</button>
                              <b x-text="(correction.delta > 0 ? '+' : '') + correction.delta"></b>
                              <button class="ecrm-btn ecrm-btn-soft" @click="correction.delta++">+</button>
                            </div>
                            <input class="ecrm-input" placeholder="Warum? (Pflicht), z. B. Kulanz" x-model="correction.comment">
                            <div class="ecrm-actions">
                              <button class="ecrm-btn" @click="correctFor = null">Abbrechen</button>
                              <button class="ecrm-btn ecrm-btn-primary" @click="saveCorrection(e)" :disabled="busy">Buchen</button>
                            </div>
                          </div>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>
              </template>

              <div class="ecrm-card ecrm-section">
                <div class="ecrm-section-head"><div class="ecrm-h">Verlauf</div><div class="ecrm-text-s">Alles, was diese Person in App und Kursen gemacht hat.</div></div>
                <template x-for="(f, i) in detail.feed" :key="i">
                  <div class="ecrm-item">
                    <span class="ecrm-dot" :class="'ecrm-k-' + feedKind(f.art)"></span>
                    <span class="ecrm-grow ecrm-feedtext" x-text="feedText(f, true)"></span>
                    <span class="ecrm-when" x-text="dateShort(f.am)"></span>
                  </div>
                </template>
                <template x-if="!detail.feed.length"><p class="ecrm-empty">Noch keine Aktivität.</p></template>
              </div>

              <details class="ecrm-more">
                <summary>Weitere Aktionen</summary>
                <div class="ecrm-actions ecrm-actions-l">
                  <button class="ecrm-btn" @click="openForm(detail.c)">Notiz &amp; Kontakt</button>
                  <button class="ecrm-btn" @click="toggleArchive()" x-text="detail.c.archived_at ? 'Wieder anzeigen' : 'Ausblenden'"></button>
                  <template x-if="isOwner"><button class="ecrm-btn ecrm-danger" @click="anonymize()">Löschen</button></template>
                </div>
                <p class="ecrm-legend">Ausblenden: Die Person erscheint nicht mehr in den Listen, alles bleibt gespeichert. Löschen: Name und Kontakt werden entfernt (Datenschutz), Buchungen bleiben anonym.</p>
              </details>
              </div></div>
            </div>
          </template>
        </section>

        <!-- ================= MENSCH: Notiz & Kontakt ================= -->
        <section class="ecrm-narrow" x-show="tab === 'menschen' && form">
          <template x-if="form">
            <div class="ecrm-card ecrm-section">
              <div class="ecrm-section-head"><div class="ecrm-h">Notiz &amp; Kontakt</div>
                <div class="ecrm-text-s">Name und E-Mail kommen aus der App. Hier ergänzt du, was nur du brauchst.</div></div>
              <label class="ecrm-check"><input type="checkbox" x-model="form.is_child"> Kind (Kontakt über die Eltern)</label>
              <template x-if="form.is_child">
                <div>
                  <label class="ecrm-label">Name Elternteil<input class="ecrm-input" x-model.trim="form.guardian_name"></label>
                  <label class="ecrm-label">Telefon Eltern<input class="ecrm-input" type="tel" x-model.trim="form.guardian_phone"></label>
                </div>
              </template>
              <label class="ecrm-label">Telefon<input class="ecrm-input" type="tel" x-model.trim="form.phone"></label>
              <label class="ecrm-label">Notiz (nur Organisatorisches)<textarea class="ecrm-input" rows="3" x-model="form.note"></textarea></label>
              <p class="ecrm-hint">Bitte keine Gesundheitsangaben (Verletzungen, Beschwerden) eintragen.</p>
              <div class="ecrm-actions">
                <button class="ecrm-btn" @click="form = null">Abbrechen</button>
                <button class="ecrm-btn ecrm-btn-primary" @click="saveForm()" :disabled="busy">Speichern</button>
              </div>
            </div>
          </template>
        </section>

        <!-- ================= KURSE ================= -->
        <section class="ecrm-narrow" x-show="tab === 'kurse' && !course">
          <div class="ecrm-page-head">
            <div class="ecrm-serif ecrm-page-title">Kurse</div>
            <div class="ecrm-text-s">Genau die Termine, die es in deiner App gibt – mit Anmeldungen. Neue Termine erscheinen beim nächsten Abgleich.</div>
          </div>
          <template x-for="g in courseGroups()" :key="g.label">
            <div class="ecrm-card ecrm-section">
              <div class="ecrm-h-group" x-text="g.label"></div>
              <template x-for="s in g.items" :key="s.id">
                <button class="ecrm-item ecrm-item-btn" @click="openCourse(s)">
                  <span class="ecrm-date"><b x-text="dayNum(s.starts_at)"></b><span x-text="weekday(s.starts_at)"></span></span>
                  <span class="ecrm-grow">
                    <span class="ecrm-name" x-text="s.title"></span>
                    <span class="ecrm-text-s" x-text="time(s.starts_at) + (s.category ? ' · ' + s.category : '')"></span>
                  </span>
                  <span class="ecrm-fill"><b x-text="(s.n || 0) + (s.capacity ? '/' + s.capacity : '')"></b>
                    <span x-text="new Date(s.starts_at) < new Date() ? 'waren da' : 'angemeldet'"></span></span>
                </button>
              </template>
            </div>
          </template>
          <template x-if="!sessions.length && !loading"><p class="ecrm-empty">Noch keine Termine. Kurse aus deiner App erscheinen hier automatisch.</p></template>
          <button class="ecrm-link" @click="showPast = !showPast; loadCourses()" x-text="showPast ? 'Nur kommende Termine' : 'Auch vergangene Termine zeigen'"></button>
        </section>

        <section class="ecrm-narrow" x-show="tab === 'kurse' && course">
          <template x-if="course">
            <div>
              <button class="ecrm-back" @click="course = null">‹ Alle Kurse</button>
              <div class="ecrm-page-head">
                <div class="ecrm-serif ecrm-page-title" x-text="course.title"></div>
                <div class="ecrm-text-s" x-text="dateLong(course.starts_at) + ', ' + time(course.starts_at) + (course.category ? ' · ' + course.category : '')"></div>
              </div>
              <div class="ecrm-kpis">
                <div><b x-text="roster.filter(r => r.status === 'registered').length"></b><span>angemeldet</span></div>
                <div><b x-text="roster.filter(r => r.status === 'present').length"></b><span>waren da</span></div>
                <div><b x-text="course.capacity || '–'"></b><span>Plätze</span></div>
              </div>
              <p class="ecrm-sync" :class="'ecrm-sync-' + courseSync().art"><b x-text="courseSync().titel"></b> <span x-text="courseSync().text"></span></p>
              <div class="ecrm-card ecrm-section">
                <template x-for="r in roster" :key="r.customer_id">
                  <div class="ecrm-item ecrm-item-col">
                    <div class="ecrm-item-row">
                      <button class="ecrm-item-main" @click="openPerson(r.customer_id)">
                        <span class="ecrm-ava" :class="'ecrm-st-' + personStatus(r.customer_id)">
                          <span x-text="initials(r)"></span><img x-show="person(r.customer_id).avatar_url" :src="person(r.customer_id).avatar_url" alt="">
                        </span>
                        <span class="ecrm-grow"><span class="ecrm-name" x-text="fullName(r)"></span><span class="ecrm-text-s" x-text="rosterText(r)"></span></span>
                      </button>
                      <button class="ecrm-btn ecrm-btn-soft" x-show="rowAction(r)" @click="r._open = !r._open" x-text="r._open ? 'Schließen' : rowAction(r)"></button>
                    </div>
                    <div class="ecrm-inline" x-show="r._open && r.status === 'registered'">
                      <p class="ecrm-text-s">Die App hat nicht eindeutig gemeldet, ob diese Person noch angemeldet war. War sie da?</p>
                      <button class="ecrm-btn ecrm-btn-primary" @click="setRow(r, 'war_da')">War da</button>
                      <button class="ecrm-btn" @click="setRow(r, 'nicht_da')">War nicht da</button>
                    </div>
                    <div class="ecrm-inline" x-show="r._open && r.status === 'present'">
                      <p class="ecrm-text-s">Die Person stand zu Kursbeginn auf der Liste der App, deshalb wurde ein Besuch abgezogen. Aus Kulanz kannst du ihn zurückgeben.</p>
                      <button class="ecrm-btn" @click="setRow(r, 'kulanz')">Besuch zurückgeben</button>
                    </div>
                  </div>
                </template>
                <template x-if="!roster.length"><p class="ecrm-empty">Noch niemand angemeldet.</p></template>
              </div>
              <a class="ecrm-link" x-show="course.app_url" :href="course.app_url" target="_top">Termin in der App öffnen ›</a>
            </div>
          </template>
        </section>

        <!-- ================= ANGEBOTE ================= -->
        <section class="ecrm-narrow" x-show="tab === 'angebote'">
          <div class="ecrm-page-head">
            <div class="ecrm-serif ecrm-page-title">Deine Angebote</div>
            <div class="ecrm-text-s">Die Pläne aus deiner App. Damit das CRM Besuche zählen kann, sag einmal, was in jedem Angebot steckt.</div>
          </div>

            <template x-if="makeAktiv()">
              <div class="ecrm-plansync" :class="plansSync === 'fehler' && 'ecrm-plansync-fehler'">

                <span class="ecrm-grow">
                  <b x-text="plansSyncTitel()"></b>
                  <span class="ecrm-text-s" x-text="plansSyncText()"></span>
                </span>
                <button class="ecrm-btn ecrm-btn-soft" @click="refreshPlans(true)" :disabled="plansSync === 'laeuft'">Jetzt abgleichen</button>

            </template>
            <template x-if="!makeAktiv()">
              <p class="ecrm-text-s">Ein neuer Plan aus deiner App erscheint hier, sobald ihn jemand kauft oder zugewiesen bekommt.</p>

          </div>


          <template x-for="p in setupNeeded()" :key="p.id">
            <div class="ecrm-card ecrm-section ecrm-offer">
              <div class="ecrm-name ecrm-name-l" x-text="p.name"></div>
              <template x-if="!isOwner"><p class="ecrm-text-s">Das verbindet die Inhaberin.</p></template>
              <template x-if="isOwner">
                <div>
                  <div class="ecrm-q">Was steckt drin?</div>
                  <div class="ecrm-pick">
                    <button :class="setup[p.id].kind === 'n4' && 'ecrm-on'" @click="pickKind(p, 'n4')">4 Besuche</button>
                    <button :class="setup[p.id].kind === 'n10' && 'ecrm-on'" @click="pickKind(p, 'n10')">10 Besuche</button>
                    <button :class="setup[p.id].kind === 'n' && 'ecrm-on'" @click="pickKind(p, 'n')">andere Anzahl</button>
                    <button :class="setup[p.id].kind === 'frei' && 'ecrm-on'" @click="pickKind(p, 'frei')">ohne Zählen (Block / Abo)</button>
                  </div>
                  <input class="ecrm-input ecrm-input-s" type="number" inputmode="numeric" min="1" placeholder="Anzahl Besuche" x-show="setup[p.id].kind === 'n'" x-model.number="setup[p.id].credits">
                  <div class="ecrm-q">Wie lange gültig ab Kauf?</div>
                  <div class="ecrm-pick">
                    <button :class="setup[p.id].validity === 90 && 'ecrm-on'" @click="setup[p.id].validity = 90">3 Monate</button>
                    <button :class="setup[p.id].validity === 180 && 'ecrm-on'" @click="setup[p.id].validity = 180">6 Monate</button>
                    <button :class="setup[p.id].validity === 365 && 'ecrm-on'" @click="setup[p.id].validity = 365">1 Jahr</button>
                    <button :class="setup[p.id].validity === 0 && 'ecrm-on'" @click="setup[p.id].validity = 0">unbegrenzt</button>
                  </div>
                  <template x-if="categories.length > 1">
                    <div>
                      <div class="ecrm-q">Für welche Kurse gilt es?</div>
                      <div class="ecrm-pick">
                        <button :class="!setup[p.id].category && 'ecrm-on'" @click="setup[p.id].category = ''">alle Kurse</button>
                        <template x-for="c in categories" :key="c">
                          <button :class="setup[p.id].category === c && 'ecrm-on'" @click="setup[p.id].category = c" x-text="'nur ' + c"></button>
                        </template>
                      </div>
                    </div>
                  </template>
                  <button class="ecrm-btn ecrm-btn-primary ecrm-block" @click="saveSetup(p)" :disabled="busy">Verbinden</button>
                </div>
              </template>
            </div>
          </template>

          <template x-if="connected().length">
            <div class="ecrm-card ecrm-section">
              <div class="ecrm-section-head"><div class="ecrm-h">Verbunden</div></div>
              <template x-for="p in connected()" :key="p.id">
                <div class="ecrm-item"><span class="ecrm-grow"><span class="ecrm-name" x-text="p.name"></span><span class="ecrm-text-s" x-text="productText(p)"></span></span>
                  <i class="ecrm-chip ecrm-st-dabei">verbunden</i></div>
              </template>
            </div>
          </template>

          <div class="ecrm-explain">
            <b>Wie hängt das mit Flenski zusammen?</b>
            <p>Der Plan in Flenski regelt, ob jemand Zugang hat. Das CRM zählt, wie viele Besuche auf einer Karte noch übrig sind. Kauft jemand in der App, legt das CRM die Karte automatisch an. Ist eine Karte leer oder abgelaufen, <span x-text="planAuto() ? 'nimmt das CRM den Plan in der App automatisch weg (spätestens nach einer Stunde). Kauft die Person eine neue Karte, bekommt sie ihn mit dem Kauf zurück.' : 'siehst du die Person unter „Heute für dich“ und entziehst den Plan im Profil der App.'"></span></p>
          </div>

          <div class="ecrm-card ecrm-section">
            <div class="ecrm-section-head"><div class="ecrm-h">Konto</div>
              <p class="ecrm-text-s">Angemeldet als <b x-text="userEmail"></b> · <span x-text="tenant && tenant.name"></span></p></div>
            <button class="ecrm-btn ecrm-mb" @click="logout()">Abmelden</button>
          </div>
        </section>
      </div>
    </template>

    <a class="ecrm-powered" x-show="view !== 'boot'" href="https://www.systemsafari.de/" target="_blank" rel="noopener">Powered by <b>Systemsafari</b></a>

    <template x-teleport="body">
      <div id="ecrm-overlay">
        <div class="ecrm-toast" role="alert" x-show="toast" x-transition.opacity :class="toast && toast.error && 'ecrm-toast-error'" @click="toast = null">
          <span x-text="toast && toast.text"></span><small x-show="toast && toast.error">Tippen zum Schließen</small>
        </div>
      </div>
    </template>
  </div>
</div>

  // Das CRM füllt den Kasten, in dem es steckt (Flenski-Widget), randlos aus – kein weißer Rahmen drumherum.

      Top: r.top - h.top - (parseFloat(cs.borderTopWidth) || 0),
      Bottom: h.bottom - (parseFloat(cs.borderBottomWidth) || 0) - r.bottom
    };
    Object.keys(gap).forEach(function (k) { if (gap[k] > 0 && gap[k] <= 64) root.style['margin' + k] = -gap[k] + 'px'; });
    root.style.borderRadius = cs.borderRadius && cs.borderRadius !== '0px' ? cs.borderRadius : '';

      filteredPeople() {
        var q = this.search.trim().toLowerCase(), f = this.filter, ov = this.overview, self = this;
        var rank = { kuehlt_ab: 0, neu: 1, dabei: 2, eingeschlafen: 3 };
        return this.people
          .filter(function (p) { return (!f || p.status === f) && (!q || self.fullName(p).toLowerCase().indexOf(q) > -1); })
          .sort(function (a, b) {
            return (rank[a.status] - rank[b.status])
              || (((ov[b.customer_id] || {}).credits_balance || 0) - ((ov[a.customer_id] || {}).credits_balance || 0))
              || self.fullName(a).localeCompare(self.fullName(b));
          });
      },
      lastText(p) {
        var l = this.lastByPerson[p.customer_id];
        if (!l) return p.status === 'neu' ? 'Neu seit ' + this.sinceText(p.joined_at) + ' · noch keine Aktivität' : 'Noch keine Aktivität';
        return this.ago(l.am).replace(/^./, function (x) { return x.toUpperCase(); }) + ' · ' + this.feedText(l, true);
      },
      barStyle(n, arr) {
        var max = Math.max.apply(null, (arr || []).concat([1]));
        return 'height:' + (n ? Math.max(14, Math.round(n / max * 100)) : 5) + '%;' + (n ? '' : 'opacity:.35');
      },
      async openPerson(id) {
        this.tab = 'menschen'; this.personId = id; this.form = null; this.correctFor = null; this.detail = null; this.toTop();
        await this.loadDetail();
      },
      async loadDetail() {
        var id = this.personId, tid = this.tenant.id;
        var res = await Promise.all([
          this.sb.from('customers').select('*').eq('id', id).single(),
          this.sb.from('v_customer_engagement').select('*').eq('customer_id', id).maybeSingle(),
          this.sb.from('v_entitlement_balance').select('*').eq('customer_id', id).order('status').order('starts_at', { ascending: false }),
          this.sb.rpc('activity_feed', { p_tenant: tid, p_customer: id, p_limit: 100 }),
          this.sb.from('customer_notices').select('*').eq('customer_id', id).is('resolved_at', null).order('created_at', { ascending: false }),
          this.sb.from('entitlements').select('id,flenski_plan_revoked_at').eq('customer_id', id)
        ]);
        if (res[0].error) return this.notify(message(res[0].error), true);
        var c = res[0].data;
        var eng = res[1].data || { status: 'eingeschlafen', first_name: c.first_name, last_name: c.last_name, events_8w: [0, 0, 0, 0, 0, 0, 0, 0], besuche_gesamt: 0, score_30d: 0 };
        var entzogen = {};
        (res[5].data || []).forEach(function (x) { entzogen[x.id] = x.flenski_plan_revoked_at; });
        var ents = (res[2].data || []).map(function (e) { e.plan_entzogen_am = entzogen[e.entitlement_id] || null; return e; });
        this.detail = { c: c, eng: eng, ents: ents, feed: res[3].data || [], notices: res[4].data || [] };
      },
      entOpen(e) { var p = this.products.find(function (x) { return x.id === e.product_id; }); return !!(p && p.needs_setup); },
      balanceShort() {
        var o = this.overview[this.personId] || {}, self = this;
        var aktiv = this.detail.ents.filter(function (e) { return e.status === 'active' && !self.entOpen(e); });
        if (aktiv.some(function (e) { return !e.unlimited; })) return String(o.credits_balance || 0);
        if (aktiv.length) return '✓';
        return '–';
      },
      balanceLabel() {
        var self = this, ents = this.detail.ents.filter(function (e) { return e.status === 'active'; });
        var b = this.balanceShort();
        if (b === '–' && ents.some(function (e) { return self.entOpen(e); })) return 'Angebot noch nicht verbunden';
        if (b === '✓') return 'Block / Abo aktiv';
        return b === '–' ? 'keine Karte' : 'Besuche übrig';
      },
      entNumber(e) { return this.entOpen(e) ? '' : e.unlimited ? '✓' : e.balance; },
      entText(e) {
        if (this.entOpen(e)) return 'Gekauft am ' + this.dateShort(e.starts_at) + ' · Angebot noch nicht verbunden – unter „Angebote“ einmal einrichten';
        var st = { used_up: 'aufgebraucht', expired: 'abgelaufen', cancelled: 'storniert' }[e.status];
        var parts = [];
        if (st) parts.push(st);
        if (!e.unlimited && e.product_credits) parts.push('noch ' + e.balance + ' von ' + e.product_credits + ' Besuchen');
        if (e.unlimited) parts.push('ohne Zählen');
        if (e.expires_at) parts.push('gültig bis ' + this.dateShort(e.expires_at));
        parts.push('gekauft am ' + this.dateShort(e.starts_at));
        if (e.plan_entzogen_am) parts.push('Plan in der App entzogen am ' + this.dateShort(e.plan_entzogen_am));
        return parts.join(' · ');
      },
      noticeText(n) {
        var d = n.detail || {}, t = NOTICE[n.kind] || n.kind;
        if (n.kind === 'teilnahme_unklar') return 'Unklar, ob sie bei „' + (d.titel || 'Kurs') + '“ am ' + this.dateShort(d.beginn) + ' war. Bitte im Kurs mit „Prüfen“ bestätigen.';
        if (n.kind === 'plan_entziehen') return '„' + (d.produkt || 'Karte') + '“ ist ' + (d.grund || 'aufgebraucht') +
          '. Entzieh den Plan im Profil der App, sonst hat sie weiter Zugang. Danach hier auf „Erledigt“.';
        if (d.plan) t += ': ' + d.plan;
        if (d.produkt) t += ': ' + d.produkt;
        return t;
      },
      async resolveNotice(n) {
        await this.run(async () => {
          var r = await this.sb.from('customer_notices').update({ resolved_at: new Date().toISOString(), resolved_by: this.userId }).eq('id', n.id);
          if (r.error) throw r.error;
          this.detail.notices = this.detail.notices.filter(function (x) { return x.id !== n.id; });
          this.loadPeople();
        });
      },
      async saveCorrection(e) {
        await this.run(async () => {
          var rest = await this.rpc('correct', { p_entitlement: e.entitlement_id, p_delta: this.correction.delta, p_comment: this.correction.comment });
          this.correctFor = null;
          this.notify('Gebucht – jetzt noch ' + besuche(rest) + '.');
          await Promise.all([this.loadDetail(), this.loadPeople()]);
        });
      },
      openForm(c) { this.toTop(); this.form = Object.assign({}, c); },
      async saveForm() {
        var f = this.form;
        await this.run(async () => {
          var r = await this.sb.from('customers').update({ is_child: !!f.is_child, phone: f.phone || null, note: f.note || null,
            guardian_name: f.is_child ? (f.guardian_name || null) : null, guardian_phone: f.is_child ? (f.guardian_phone || null) : null })
            .eq('id', f.id).select().single();
          if (r.error) throw r.error;
          this.form = null;
          await this.loadDetail();
          this.notify('Gespeichert.');
        });
      },
      async toggleArchive() {
        await this.run(async () => {
          var r = await this.sb.from('customers').update({ archived_at: this.detail.c.archived_at ? null : new Date().toISOString() })
            .eq('id', this.personId).select().single();
          if (r.error) throw r.error;
          this.notify(r.data.archived_at ? 'Ausgeblendet.' : 'Wird wieder angezeigt.');
          this.personId = null; await this.loadPeople();
        });
      },
      async anonymize() {
        if (!confirm(this.fullName(this.detail.c) + ' wirklich löschen?\n\nName und Kontaktdaten werden entfernt. Buchungen bleiben anonym erhalten. Das lässt sich nicht rückgängig machen.')) return;
        await this.run(async () => {
          await this.rpc('anonymize_customer', { p_customer: this.personId });
          this.personId = null;
          await this.loadPeople();
          this.notify('Gelöscht.');
        });
      },

      // ---------- Kurse ----------
      courseGroups() {
        var groups = [], map = {}, self = this;
        this.sessions.forEach(function (s) {
          var label = self.weekLabel(new Date(s.starts_at));
          if (!map[label]) { map[label] = { label: label, items: [] }; groups.push(map[label]); }
          map[label].items.push(s);
        });
        return groups;
      },
      weekLabel(d) {
        var monday = function (x) { var m = new Date(x); m.setHours(0, 0, 0, 0); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); return m; };
        var diff = Math.round((monday(d) - monday(new Date())) / (7 * 86400000));
        if (diff === 0) return 'Diese Woche';
        if (diff === 1) return 'Nächste Woche';
        if (diff === -1) return 'Letzte Woche';
        return 'Woche ab ' + monday(d).toLocaleDateString('de-DE', { day: 'numeric', month: 'long' });
      },
      async openCourse(s) {
        this.tab = 'kurse'; this.course = s; this.roster = []; this.toTop();
        try {
          var frisch = await this.sb.from('sessions').select('*').eq('id', s.id).single();
          if (frisch.data) this.course = Object.assign({}, s, frisch.data);
          var rows = await this.rpc('session_roster', { p_session: s.id });
          this.roster = rows.map(function (r) { r._open = false; return r; });
        } catch (e) { this.notify(message(e), true); }
      },
      rosterText(r) {
        if (r.status === 'present') return 'War da' + (r.abgebucht && r.rest != null ? ' · noch ' + besuche(r.rest) : '');
        if (r.status === 'registered') return 'Angemeldet' + (r.credits_balance ? ' · ' + besuche(r.credits_balance) + ' auf der Karte' : '');
        if (r.status === 'cancelled_in_time') return 'Hat sich abgemeldet · kein Besuch abgezogen';
        if (r.status === 'no_show' && !r.abgebucht) return 'Kulanz · kein Besuch abgezogen';
        if (r.status === 'cancelled_late') return 'Zu spät abgesagt' + (r.abgebucht ? ' · Besuch abgezogen' : '');
        return 'Nicht erschienen' + (r.abgebucht ? ' · Besuch abgezogen' : '');
      },
      started() { return this.course && new Date(this.course.starts_at) <= new Date(); },
      rowAction(r) {
        if (!this.started()) return '';
        if (r.status === 'registered') return 'Prüfen';
        if (r.status === 'present' && r.abgebucht) return 'Kulanz';
        return '';
      },
      async setRow(r, art) {
        if (art === 'kulanz' && !confirm('Besuch für ' + this.fullName(r) + ' zurückgeben?')) return;
        await this.run(async () => {
          await this.rpc('set_attendance', { p_session: this.course.id, p_customer: r.customer_id, p_art: art });
          this.notify(this.fullName(r) + ({ war_da: ': war da', nicht_da: ': war nicht da', kulanz: ': Besuch zurückgegeben' })[art]);
          await Promise.all([this.openCourse(this.course), this.loadPeople()]);
        });
      },
      async openCourseId(id) {
        var r = await this.sb.from('sessions').select('*').eq('id', id).maybeSingle();
        if (r.data) await this.openCourse(r.data);
      },
      courseSync() {
        var c = this.course, info = c.abgleich_info || {};
        var um = function (iso) { return new Date(iso).toLocaleString('de-DE', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' Uhr'; };
        if (!c.flenski_event_id) return { art: 'aus', titel: 'Eigener Termin.', text: 'Nicht aus der App, die Liste pflegst du selbst.' };
        var offen = this.roster.filter(function (r) { return r.status === 'registered'; }).length;
        if (c.abgeglichen_at) {
          var t = 'Wer zu Beginn auf der Liste der App stand, zählt als „war da“, wer sich vorher abgemeldet hat, zahlt nichts.';
          if (offen) return { art: 'warn', titel: 'Fast fertig abgeglichen.', text: offen + (offen === 1 ? ' Person ist' : ' Personen sind') + ' unklar – bitte kurz bestätigen (Knopf „Prüfen“).' };
          return { art: 'ok', titel: 'Mit der App abgeglichen am ' + um(c.abgeglichen_at) + '.', text: t };
        }
        if (info.fehlt && offen) return { art: 'warn', titel: 'Abgleich hat nicht geklappt.', text: 'Die App war zu Kursbeginn nicht erreichbar. Bitte bestätige die Angemeldeten mit „Prüfen“.' };
        if (this.started()) return { art: 'ok', titel: 'Wird gerade abgeglichen.', text: 'Wenige Minuten nach Kursbeginn holt das CRM die endgültige Liste aus der App.' };
        return { art: 'ok', titel: 'Live aus der App' + (c.flenski_seen_at ? ', Stand ' + um(c.flenski_seen_at) : '') + '.',
                 text: 'Wer sich in der App an- oder abmeldet, erscheint hier automatisch. 5 Minuten nach Beginn zählt, wer noch auf der Liste steht: Besuch wird abgezogen.' };
      },

      // ---------- Angebote ----------
      pickKind(p, kind) {
        var s = this.setup[p.id];
        s.kind = kind;
        if (kind === 'n4') s.credits = 4;
        if (kind === 'n10') s.credits = 10;
      },
      async saveSetup(p) {
        var s = this.setup[p.id];
        if (!s.kind) return this.notify('Bitte wähle, was in „' + p.name + '“ steckt.', true);
        if (s.kind === 'n' && !(s.credits > 0)) return this.notify('Bitte gib die Anzahl Besuche an.', true);
        if (s.validity === null) return this.notify('Bitte wähle, wie lange es gültig ist.', true);
        await this.run(async () => {
          var n = await this.rpc('setup_product', { p_product: p.id, p_type: s.kind === 'frei' ? 'period' : 'credits',
            p_credits: s.kind === 'frei' ? null : s.credits, p_validity_days: s.validity || null, p_price_cents: null, p_category: s.category || null });
          this.notify('„' + p.name + '“ ist verbunden' + (n ? ' – ' + n + (n === 1 ? ' Kauf' : ' Käufe') + ' übernommen.' : '.'));
          await Promise.all([this.loadProducts(), this.loadPeople()]);
        });
      },
      productText(p) {
        var t = p.type === 'credits' ? p.credits + ' Besuche' : p.type === 'single' ? 'Einzelstunde' : 'ohne Zählen';
        t += p.validity_days ? ' · ' + (p.validity_days % 30 === 0 ? p.validity_days / 30 + ' Monate' : p.validity_days + ' Tage') + ' gültig' : ' · unbegrenzt gültig';
        if (p.category) t += ' · nur ' + p.category;
        return t;
      },

      // ---------- Formatierung ----------
      ago(iso) {
        var d = days(iso);
        if (d <= 0) return 'heute';
        if (d === 1) return 'gestern';
        if (d < 30) return 'vor ' + d + ' Tagen';
        return 'am ' + this.dateShort(iso);
      },
      time(iso) { return new Date(iso).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr'; },
      dateShort(iso) { return iso ? new Date(iso).toLocaleDateString('de-DE', { day: 'numeric', month: 'numeric' }).replace(/.?$/, '.') : ''; },
      dateLong(iso) { return new Date(iso).toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' }); },
      dayNum(iso) { return new Date(iso).getDate(); },
      weekday(iso) { return new Date(iso).toLocaleDateString('de-DE', { weekday: 'short' }).replace('.', ''); }
    };
  }

  document.addEventListener('alpine:init', function () { window.Alpine.data('ecrm', component); });
  load(LIB_SUPABASE, function () { return !!window.supabase; })
    .then(function () {
      if (window.Alpine) { window.Alpine.data('ecrm', component); window.Alpine.initTree(root); return; }
      return load(LIB_ALPINE, function () { return !!window.Alpine; });
    })
    .catch(function (e) { boot.textContent = 'Das CRM konnte nicht geladen werden. Bitte Seite neu laden. (' + e.message + ')'; });
})();
</script>
